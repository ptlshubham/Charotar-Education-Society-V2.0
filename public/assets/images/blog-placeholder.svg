<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Cover for a blog post published without an image: brand navy, a faint dot grid and a
       picture icon, kept in the middle so every crop (wide cards, square thumbnails) shows it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c4370" />
      <stop offset="1" stop-color="#203154" />
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.5" fill="#ffffff" fill-opacity="0.07" />
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)" />
  <rect width="1200" height="800" fill="url(#dots)" />
  <g transform="translate(600 400)" fill="none" stroke="#ffffff" opacity="0.55" stroke-width="12"
    stroke-linecap="round" stroke-linejoin="round">
    <rect x="-120" y="-92" width="240" height="184" rx="26" />
    <path d="M-120 58 L-48 -14 L18 50 L54 16 L120 66" />
  </g>
  <circle cx="652" cy="352" r="22" fill="#f5a623" />
</svg>
