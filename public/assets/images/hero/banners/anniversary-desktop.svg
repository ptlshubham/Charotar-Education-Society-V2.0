<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 520" width="1920" height="520" role="img" aria-label="Charotar Education Society — 110 Years, A Legacy Since 1916">
  <defs>
    <linearGradient id="ad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22397a"/>
      <stop offset="0.55" stop-color="#1b3268"/>
      <stop offset="1" stop-color="#152650"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="520" fill="url(#ad-bg)"/>
  <!-- left photo placeholder -->
  <rect x="0" y="0" width="820" height="520" fill="#0f1c3a"/>
  <path d="M0 0 H900 A320 520 0 0 1 620 520 H0 Z" fill="#0f1c3a"/>
  <text x="120" y="290" font-family="system-ui,'Segoe UI',Arial,sans-serif" font-size="30" font-weight="600" fill="#5f7099">[ campus photo ]</text>
  <!-- right text panel -->
  <g font-family="system-ui,'Segoe UI',Arial,sans-serif">
    <text x="1180" y="150" font-size="150" font-weight="800" fill="#f5a623" letter-spacing="2">110</text>
    <text x="1470" y="120" font-size="52" font-weight="700" fill="#f5a623">YEARS</text>
    <text x="1470" y="165" font-size="26" font-weight="600" fill="#ffffff" letter-spacing="4">ANNIVERSARY</text>
    <text x="1180" y="255" font-size="30" font-weight="700" fill="#ffffff">A Legacy <tspan fill="#f5a623">Since 1916</tspan></text>
    <text x="1180" y="320" font-size="40" font-weight="700" fill="#ffffff">Established on <tspan fill="#f5a623">16th April 1916</tspan></text>
    <text x="1180" y="372" font-size="28" font-weight="500" fill="#e8ecf6">Charotar Education Society, Anand  dedicated to</text>
    <text x="1180" y="410" font-size="28" font-weight="500" fill="#e8ecf6">advancing education and shaping generations.</text>
    <text x="1180" y="470" font-size="22" font-weight="600" fill="#f5a623">Celebrating another milestone in our journey.</text>
  </g>
  <text x="1880" y="504" text-anchor="end" font-family="system-ui,Arial,sans-serif" font-size="16" fill="#5f7099">placeholder  1920 × 520</text>
</svg>
