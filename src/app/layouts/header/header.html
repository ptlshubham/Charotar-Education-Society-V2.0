<header
  class="relative z-60 flex items-center justify-between px-5 py-5.75 md:px-10 lg:px-17.5 lg:py-3.5 lg:border-gray-200 bg-white shadow md:shadow-xs">

  <!-- Left: Logo + Desktop Nav -->
  <div class="flex items-center gap-10 lg:gap-6 ">
    <a class="shrink-0" routerLink="/">
      <img src="/assets/logo/default-logo.svg" alt="Charotar Education Society" width="135" height="34" class="block" />
    </a>

    <nav class="hidden lg:flex xl:ml-7.5 ">
      <ul class="flex items-center gap-6.75 list-none m-0 p-0">
        @for (item of navLinks; track item.link) {
          <li>
            <a [routerLink]="item.link"
              class="inline-flex items-center text-[16px] font-medium no-underline whitespace-nowrap border-b-2 border-transparent pb-0.5 transition-colors hover:text-main"
              [class.text-main]="linkActive(item.link)" [class.border-main]="linkActive(item.link)" [class.text-primary]="!linkActive(item.link)">{{ item.label }}</a>
          </li>
        }
      </ul>
    </nav>
  </div>

  <!-- Right: Desktop Actions -->
  <div class="hidden lg:flex items-center gap-2.5">
    <a class="text-sm h-10 font-medium text-white flex justify-center items-center no-underline rounded-[8px] bg-main whitespace-nowrap px-[20px]"
      routerLink="/contact">Contact Us</a>
  </div>

  <!-- Mobile: Animated Burger ↔ X toggle -->
  <div class="burger lg:hidden"
    [class.open]="mobileMenuOpen"
    [attr.aria-label]="mobileMenuOpen ? 'Close menu' : 'Open menu'"
    role="button"
    tabindex="0"
    (click)="mobileMenuOpen ? closeMobileMenu() : openMobileMenu()"
    (keydown.enter)="mobileMenuOpen ? closeMobileMenu() : openMobileMenu()"
    (keydown.space)="mobileMenuOpen ? closeMobileMenu() : openMobileMenu()">
    <span></span>
    <span></span>
    <span></span>
  </div>

</header>

<!-- ─── Overlay: full screen, covers entire viewport when open ─── -->
<div #mobileOverlay class="fixed inset-0 z-[75] bg-black/40 cursor-pointer invisible opacity-0"
  (click)="closeMobileMenu()">
</div>

<!-- ─── Sidebar: mobile / tablet menu, slides from right ─── -->
<aside #mobileSidebar
  class="fixed top-0 right-0 h-dvh w-full  translate-x-full bg-white z-[80] flex flex-col shadow-2xl">

  <!-- Header row -->
  <div class="shrink-0 flex items-center justify-between px-5 h-[68px] border-b border-primary/10">
    <img src="/assets/logo/default-logo.svg" alt="Charotar Education Society" width="120" height="30" />
    <button type="button" aria-label="Close menu" (click)="closeMobileMenu()"
      class="flex items-center justify-center w-9 h-9 rounded-full bg-[#f8f9fa] text-secondary">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <!-- Scrollable content -->
  <div class="flex-1 overflow-y-auto flex flex-col">

    <!-- Nav -->
    <nav class="px-4 py-2">
      @for (item of navLinks; track item.link) {
        <a [routerLink]="item.link" (click)="closeMobileMenu()"
          class="flex items-center gap-3 my-2 px-3 py-2.5 rounded-[12px] transition-colors border-b border-primary/10 rounded-b-none last:border-b-0">
          <span class="flex-1 text-[17px] font-bold" [ngClass]="linkActive(item.link) ? 'text-main' : 'text-primary'">{{ item.label }}</span>
        </a>
      }
    </nav>

    <!-- Action buttons -->
    <div class="px-4 mt-5 flex flex-col gap-3">
      <a routerLink="/contact" (click)="closeMobileMenu()" class="flex items-center justify-center gap-2 h-12 rounded-[10px] bg-main text-white text-[15px] font-semibold hover:bg-primary transition-colors">
        Contact Us
      </a>
    </div>

    <!-- Socials -->
    <div class="mt-6 bg-[#f6faf9] px-4 py-6 text-center">
      <p class="text-[14px] font-semibold text-secondary mb-4">Follow us on</p>
      <div class="flex items-center justify-center gap-3">
        <a href="#" aria-label="Instagram" class="flex items-center justify-center w-12 h-12 rounded-[12px] border border-primary/10 bg-white text-primary hover:bg-primary hover:text-white transition-colors">
        <img src="/assets/images/smm/icons/instagram.svg" alt="Instagram"/>
        </a>
        <a href="#" aria-label="LinkedIn" class="flex items-center justify-center w-12 h-12 rounded-[12px] border border-primary/10 bg-white text-primary hover:bg-primary hover:text-white transition-colors">
            <img src="/assets/images/smm/icons/linkedin.svg" alt="LinkedIn"/>
        </a>
        <a href="#" aria-label="Facebook" class="flex items-center justify-center w-12 h-12 rounded-[12px] border border-primary/10 bg-white text-primary hover:bg-primary hover:text-white transition-colors">
          <img src="/assets/images/smm/icons/facebook.svg" alt="Facebook"/>
        </a>
        <a href="#" aria-label="YouTube" class="flex items-center justify-center w-12 h-12 rounded-[12px] border border-primary/10 bg-white text-primary hover:bg-primary hover:text-white transition-colors">
          <img src="/assets/images/smm/icons/youtube.svg" alt="YouTube"/>
        </a>
        <a href="#" aria-label="X" class="flex items-center justify-center w-12 h-12 rounded-[12px] border border-primary/10 bg-white text-primary hover:bg-primary hover:text-white transition-colors">
           <img src="/assets/images/smm/icons/x.svg" alt="X" class="w-8 h-8"/>
        </a>
      </div>
    </div>
  </div>

</aside>
