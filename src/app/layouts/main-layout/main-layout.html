<app-header />
<!-- Header banners - a site-wide notice - on portrait tablets, where the header has no room for them.
     Below the sticky header, so it scrolls away with the page; only while one is active. Not on phones
     (CES's call: the strip pushed the page too far down). -->
@if (headerBanners.ads().length) {
<div class="hidden justify-center border-b border-[#e7ebf2] bg-[#f4f6fa] px-4 py-2 md:flex lg:hidden">
  <app-header-ads class="aspect-[440/128] w-full max-w-[300px] overflow-hidden rounded-md" />
</div>
}
<main class="page-content">
  <router-outlet />
  <!-- Admin-entered FAQs for this page (SEO Management → AI Search & Assistants).
       ngSkipHydration: the browser re-renders it from the live SEO data, so FAQs edited
       since the last deploy never trip a hydration mismatch. -->
  <app-page-faq ngSkipHydration />
</main>

<app-footer />

<!-- Global AI assistant (launcher + chat panel) - visible on all routes -->
<app-ai-assistant />

<!-- Global back-to-top button  visible on all routes once scrolled down -->
<app-scroll-to-top />

<!-- Cookie consent banner  slides in after 2.5s -->
<app-cookie-consent />

<!-- Universal newsletter subscribe success popup -->
<app-subscribe-success-modal />

<!-- Common success popup (contact form, etc.) -->
<app-success-dialog />

<!-- Site-wide photo viewer - every gallery opens it through LightboxService -->
<app-lightbox />

<!-- Announcement popup (Website Management → Website Popup) - once per visit, after the cookie notice -->
<app-site-popup />

<!-- No Internet - laid over the page while the connection is down, so the page is still there when it
     returns. Below the page loader and the cookie banner (z 9998+). data-lenis-prevent: it scrolls on
     its own, not the page. -->
@if (connection.offline()) {
<div class="fixed inset-0 z-[9000] flex flex-col overflow-y-auto bg-[#F7F9FC]" data-lenis-prevent aria-live="assertive">
  <app-no-internet class="my-auto block" />
</div>
}
