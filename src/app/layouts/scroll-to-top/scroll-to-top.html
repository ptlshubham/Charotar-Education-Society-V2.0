<!-- Global back-to-top button  a solid circular button so it stays visible on any
     background (including navy sections). Sits at the bottom-right corner, below
     the AI button. Hidden at the top; fades in once scrolled down. -->
<button
  type="button"
  aria-label="Scroll back to top"
  (click)="scrollToTop()"
  [class.opacity-0]="!visible()"
  [class.translate-y-3]="!visible()"
  [class.pointer-events-none]="!visible()"
  class="fixed bottom-6 right-6 z-50 flex h-[52px] w-[52px] items-center justify-center rounded-full bg-white text-primary cursor-pointer ring-1 ring-black/5 shadow-[0_6px_20px_rgba(11,40,39,0.25)] transition-all duration-300 hover:scale-105 hover:bg-primary hover:text-white hover:ring-2 hover:ring-white/70 hover:shadow-[0_10px_26px_rgba(11,40,39,0.35)]">
  <!-- Up arrow -->
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"
    stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
    xmlns="http://www.w3.org/2000/svg">
    <path d="M12 19V5M12 5L5 12M12 5L19 12" />
  </svg>
</button>
