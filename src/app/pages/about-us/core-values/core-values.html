<section class="site-container pt-5">
  <div class="p-6 lg:p-8">

    <h2 class="text-center text-[22px] font-bold text-primary sm:text-[26px]">Core Values That Drive Us</h2>
    <div class="mx-auto mt-4 h-[3px] w-16 rounded-full bg-secondary"></div>

    <ul class="mt-7 grid list-none grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-6">
      @for (value of values; track value.title) {
        <li class="rounded-lg px-3 py-6 text-center">
          <span class="material-symbols-outlined mx-auto block text-secondary !text-[28px] [font-variation-settings:'wght'_300]">{{ value.icon }}</span>
          <h3 class="mt-3 text-[14px] font-bold text-primary">{{ value.title }}</h3>
          <p class="mt-1.5 text-[11px] leading-relaxed text-muted">{{ value.body }}</p>
        </li>
      }
    </ul>

  </div>
</section>
