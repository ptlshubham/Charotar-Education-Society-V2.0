<section class="mx-auto max-w-[1600px] px-4 pt-5 sm:px-6 lg:px-10">
  <div class="rounded-xl border border-gray-200 bg-white p-6 lg:p-8">

    <h2 class="text-center text-[22px] font-bold text-primary sm:text-[26px]">Core Values That Drive Us</h2>

    <ul class="mt-7 grid list-none grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-6">
      @for (value of values; track value.title) {
        <li class="rounded-lg bg-[#F7F9FC] px-3 py-6 text-center transition-colors hover:bg-secondary/10">
          <svg class="mx-auto text-secondary" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            @for (d of value.path; track d) { <path [attr.d]="d" /> }
          </svg>
          <h3 class="mt-3 text-[14px] font-bold text-primary">{{ value.title }}</h3>
          <p class="mt-1.5 text-[11px] leading-relaxed text-muted">{{ value.body }}</p>
        </li>
      }
    </ul>

  </div>
</section>
