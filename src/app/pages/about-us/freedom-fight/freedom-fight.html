<section class="site-container pt-5 pb-12">
  <div class="py-4">

    <h2 class="text-center text-[22px] font-bold text-primary sm:text-[26px]">Contribution to National Freedom Fight
    </h2>
    <span class="mx-auto mt-3 block h-1 w-16 rounded-full bg-secondary" aria-hidden="true"></span>

    <div class="mt-7 grid items-center gap-6 lg:grid-cols-[0.8fr_1.6fr]">

      <img [src]="image" alt="Historical photograph of the freedom movement" loading="lazy"
        class="h-full max-h-[300px] w-full rounded-lg bg-primary-light object-cover" />

      <ol class="relative grid list-none gap-4 sm:grid-cols-2 xl:grid-cols-4 mt-8 lg:mt-0">
        <!-- Connector, desktop only: sits behind the nodes at their centre line. -->
        <span class="pointer-events-none absolute top-5 right-[12%] left-[12%] hidden h-px bg-gray-200 xl:block"
          aria-hidden="true"></span>

        @for (event of events; track event.year; let last = $last) {
        <li class="relative text-center">
          <span class="mx-auto flex h-10 w-10 items-center justify-center rounded-full bg-white relative z-10"
            aria-hidden="true">
            <span class="absolute inset-0 rounded-full bg-primary/8"></span>
            <span
              class="material-symbols-outlined relative z-10 !text-[20px] text-primary [font-variation-settings:'wght'_300]">{{
              event.icon }}</span>
          </span>

          <p class="mt-4 text-[16px] font-bold text-primary">{{ event.year }}</p>
          <p class="mt-0.5 text-[13px] font-semibold text-secondary">{{ event.title }}</p>
          <p class="mt-2 text-[12px] leading-relaxed text-muted">{{ event.body }}</p>
        </li>
        }
      </ol>

    </div>
  </div>
</section>
