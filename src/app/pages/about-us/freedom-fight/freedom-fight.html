<section class="site-container pt-5 pb-12">
  <div class="rounded-xl border border-gray-200 bg-white p-6 lg:p-8">

    <h2 class="text-center text-[22px] font-bold text-primary sm:text-[26px]">Contribution to National Freedom Fight</h2>

    <div class="mt-7 grid gap-6 lg:grid-cols-[0.8fr_1.6fr]">

      <img [src]="image" alt="Historical photograph of the freedom movement" loading="lazy"
        class="h-full max-h-[300px] w-full rounded-lg bg-primary-light object-cover" />

      <!-- Steps: arrows between cards on desktop, stacked on mobile. -->
      <ol class="grid list-none gap-4 sm:grid-cols-2 xl:grid-cols-4">
        @for (event of events; track event.year; let last = $last) {
          <li class="relative flex flex-col rounded-lg bg-[#F7F9FC] p-4">
            <span class="flex h-10 w-10 items-center justify-center rounded-full bg-primary/8 text-primary" aria-hidden="true">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                @for (d of event.path; track d) { <path [attr.d]="d" /> }
              </svg>
            </span>

            <p class="mt-3 text-[16px] font-bold text-primary">{{ event.year }}</p>
            <p class="mt-0.5 text-[13px] font-semibold text-secondary">{{ event.title }}</p>
            <p class="mt-2 text-[12px] leading-relaxed text-muted">{{ event.body }}</p>

            @if (!last) {
              <svg class="absolute top-1/2 -right-3 hidden -translate-y-1/2 text-gray-300 xl:block" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 12h14M13 6l6 6-6 6" />
              </svg>
            }
          </li>
        }
      </ol>

    </div>
  </div>
</section>
