<section class="site-container pt-5">
  <div class="rounded-xl border border-gray-200 bg-white p-6 lg:p-8">

    <h2 class="text-center text-[22px] font-bold text-primary sm:text-[26px]">A Legacy Captured in Time</h2>

    <ul class="mt-7 grid list-none grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-5">
      @for (photo of photos; track photo; let i = $index) {
        <li class="overflow-hidden rounded-lg" [class.col-span-2]="i === 4" [class.sm:col-span-1]="i === 4">
          <img [src]="photo" alt="Charotar Education Society archive photograph" loading="lazy"
            class="aspect-[4/3] w-full bg-primary-light object-cover transition-transform duration-300 hover:scale-105" />
        </li>
      }
    </ul>

    <div class="mt-7 text-center">
      <a routerLink="/glory/gallery"
        class="inline-flex items-center gap-2 rounded-md bg-primary px-6 py-3 text-[14px] font-semibold text-white no-underline transition-colors hover:bg-primary-dark">
        View All Gallery
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
      </a>
    </div>

  </div>
</section>
