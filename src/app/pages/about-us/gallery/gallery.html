@if (photos()?.length !== 0) {
<section class="site-container py-16 lg:py-20" aria-labelledby="gallery-title">

  <!-- Heading, with the link to the full gallery on the right -->
  <div class="flex flex-wrap items-end justify-between gap-x-6 gap-y-4">
    <div>
      <p class="text-[12px] font-semibold tracking-[2px] text-secondary-ink uppercase sm:text-[14px]">Our Gallery</p>
      <h2 id="gallery-title" class="mt-3 text-[28px] leading-[1.1] font-semibold text-primary sm:text-[36px] lg:text-[40px]">
        A legacy captured in time.
      </h2>
    </div>
    <a routerLink="/glory/gallery"
      class="inline-flex items-center gap-2 text-[14px] font-semibold text-primary no-underline transition-colors hover:text-secondary sm:text-[15px]">
      View Gallery
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6" />
      </svg>
    </a>
  </div>

  <!-- Strip: scrolls sideways and snaps to each photo; from tablets up every fifth one is wider.
       Touch swipes natively, a mouse drags it; data-lenis-prevent-horizontal keeps the page's
       smooth scroll from swallowing sideways trackpad swipes (up/down still scrolls the page).
       A photo opens the site-wide viewer. -->
  <div #track id="gallery-track"
    class="gallery-track relative mt-8 flex snap-x snap-mandatory items-start overflow-x-auto rounded-lg outline-none select-none focus-visible:ring-2 focus-visible:ring-secondary focus-visible:ring-offset-4 lg:mt-10"
    [class.is-free]="free()" [class.is-grabbing]="grabbing()" data-lenis-prevent-horizontal
    role="region" aria-roledescription="carousel" aria-label="Photos from the CES gallery" tabindex="0"
    (scroll)="measure()" (pointerdown)="onPointerDown($event)" (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp($event)" (pointercancel)="onPointerUp($event)">
    @if (photos(); as list) {
    @for (photo of list; track $index; let i = $index) {
    <button type="button" (click)="view(i)" [attr.aria-label]="'View photo ' + (i + 1) + ' of ' + list.length"
      class="gallery-slide group relative snap-start overflow-hidden rounded-lg bg-primary-light" [class.is-wide]="i % 5 === 0">
      <img [src]="photo.src" [alt]="photo.caption" loading="lazy" draggable="false"
        class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105" />
      <span class="pointer-events-none absolute inset-0 flex items-center justify-center bg-black/0 opacity-0 transition-all duration-300 group-hover:bg-black/25 group-hover:opacity-100"
        aria-hidden="true">
        <span class="flex h-11 w-11 items-center justify-center rounded-full bg-white/90 text-primary">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5M11 8v6M8 11h6" />
          </svg>
        </span>
      </span>
    </button>
    }
    } @else {
    @for (n of skeleton; track n) {
    <div class="gallery-slide animate-pulse rounded-lg bg-gray-100" [class.is-wide]="n === 0" aria-hidden="true"></div>
    }
    }
  </div>

  <!-- Progress line, count and arrows -->
  <div class="mt-6 h-0.5 overflow-hidden rounded-full bg-gray-200" aria-hidden="true">
    <span class="block h-full rounded-full bg-secondary transition-[width] duration-300" [style.width.%]="fill()"></span>
  </div>

  <div class="mt-4 flex items-center justify-between">
    <p class="text-[13px] text-muted tabular-nums" aria-hidden="true">
      @if (photos(); as list) {
      {{ pad(current()) }} / {{ pad(list.length) }}
      }
    </p>
    <div class="flex gap-3">
      <button type="button" (click)="step(-1)" [disabled]="atStart()" aria-label="Previous photos" aria-controls="gallery-track"
        class="flex h-10 w-10 items-center justify-center rounded-full border border-gray-300 text-primary transition-colors hover:border-primary hover:bg-primary hover:text-white disabled:pointer-events-none disabled:opacity-40">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5M11 6l-6 6 6 6" />
        </svg>
      </button>
      <button type="button" (click)="step(1)" [disabled]="atEnd()" aria-label="Next photos" aria-controls="gallery-track"
        class="flex h-10 w-10 items-center justify-center rounded-full border border-gray-300 text-primary transition-colors hover:border-primary hover:bg-primary hover:text-white disabled:pointer-events-none disabled:opacity-40">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </button>
    </div>
  </div>

</section>
}
