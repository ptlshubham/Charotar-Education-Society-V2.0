<section class="site-container pt-16 lg:pt-20" aria-labelledby="journey-title">

  <p class="flex items-center gap-4 text-[12px] font-semibold tracking-[2px] text-secondary uppercase sm:text-[14px]">
    <span class="block h-[3px] w-10 rounded-full bg-secondary sm:w-12" aria-hidden="true"></span>
    Our Journey
  </p>
  <h2 id="journey-title" class="mt-3 text-[28px] leading-[1.1] font-semibold text-primary sm:text-[36px] lg:text-[40px]">
    {{ years }}+ years of education and service.
  </h2>

  <!-- Timeline: a vertical rail on phones and tablets, one row of six from desktop up.
       Each dot sits level with its year. -->
  <ol class="relative mt-10 grid list-none gap-8 p-0 lg:mt-14 lg:grid-cols-6 lg:gap-6">
    <span class="absolute top-[5px] right-0 left-0 hidden h-0.5 bg-primary/10 lg:block" aria-hidden="true"></span>

    @for (milestone of milestones; track milestone.year; let last = $last) {
    <li class="relative pl-9 lg:pt-10 lg:pl-0">
      @if (!last) {
      <span class="absolute top-[11px] -bottom-[43px] left-[5px] w-0.5 bg-primary/10 lg:hidden" aria-hidden="true"></span>
      }
      <span class="absolute top-[5px] left-0 h-3 w-3 rounded-full bg-secondary lg:top-0" aria-hidden="true"></span>

      <p class="text-[22px] leading-none font-bold lg:text-[24px] xl:text-[26px]" [class]="last ? 'text-secondary' : 'text-primary'">
        {{ milestone.year }}
      </p>
      <h3 class="mt-3 text-[16px] font-semibold text-primary xl:text-[18px]">{{ milestone.title }}</h3>
      <p class="mt-2 text-[15px] leading-relaxed text-muted xl:text-[16px]">{{ milestone.body }}</p>
    </li>
    }
  </ol>

  <a routerLink="/about/history"
    class="group mt-10 inline-flex items-center gap-2 rounded-lg border border-primary/20 px-5 py-3 text-[15px] font-semibold text-primary no-underline transition-colors hover:border-primary lg:mt-12">
    Read the full history
    <svg class="transition-transform group-hover:translate-x-1" width="16" height="16" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M5 12h14M13 6l6 6-6 6" />
    </svg>
  </a>

</section>
