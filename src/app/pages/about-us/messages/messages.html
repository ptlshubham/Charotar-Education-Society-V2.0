<section class="site-container grid gap-5 pt-5 lg:grid-cols-2">
  @for (leader of leaders; track leader.name) {
    <article class="flex gap-5 rounded-xl border border-gray-200 bg-white p-6">

      <img [src]="leader.photo" [alt]="leader.name" loading="lazy"
        class="h-[130px] w-[110px] shrink-0 rounded-lg bg-primary-light object-cover" />

      <div class="min-w-0">
        <h2 class="text-[15px] font-bold text-primary">{{ leader.heading }}</h2>

        <blockquote class="mt-3 flex gap-2">
          <svg class="mt-0.5 shrink-0 text-secondary" width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M7 7h4v4c0 3-1.8 5.3-4.5 6L6 15.6c1.3-.4 2-1.3 2-2.6H7a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2zm10 0h4v4c0 3-1.8 5.3-4.5 6L16 15.6c1.3-.4 2-1.3 2-2.6h-1a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z" />
          </svg>
          <p class="text-[13px] leading-relaxed text-muted">{{ leader.quote }}</p>
        </blockquote>

        <p class="mt-4 text-[13px] font-semibold text-primary">{{ leader.name }}</p>
        <p class="text-[12px] text-muted">{{ leader.role }}</p>

        <a href="#" class="mt-3 inline-flex items-center gap-1.5 text-[13px] font-semibold text-primary no-underline hover:text-accent">
          Read Full Message
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
        </a>
      </div>

    </article>
  }
</section>
