<section class="bg-primary">
  <div class="site-container py-14">
    <ul class="grid list-none gap-10 lg:grid-cols-2 lg:gap-0 lg:divide-x lg:divide-white/12">
      @for (leader of leaders; track leader.name; let i = $index) {
      <li class="flex flex-col items-start gap-6 sm:flex-row lg:px-8">

        <div class="h-52 w-44 shrink-0 overflow-hidden rounded-xl bg-primary-light ring-1 ring-white/10">
          <img [src]="leader.photo" [alt]="leader.name" loading="lazy" class="h-full w-full object-cover" />
        </div>

        <div>
          <blockquote class="mt-2 max-w-md text-[15px] leading-relaxed text-white/90">{{ leader.quote }}</blockquote>

          <p class="mt-4 text-[14px] font-bold text-secondary uppercase">{{ leader.name }}</p>
          <p class="text-[12.5px] text-white/60">{{ leader.role }}</p>

          <a href="#"
            class="mt-4 inline-flex items-center gap-1.5 rounded-md border border-white/30 px-4 py-2 text-[12.5px] font-semibold text-white no-underline transition-colors hover:bg-white hover:text-primary">
            Read Message
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h14M13 6l6 6-6 6" />
            </svg>
          </a>
        </div>

      </li>
      }
    </ul>
  </div>
</section>
