<section class="site-container grid gap-5 py-16 lg:grid-cols-[1.05fr_1fr]">

  <!-- Left Column: Map -->
  <article class="lg:pl-8 flex flex-col justify-center">
    <div>
      <p class="text-[13px] font-bold text-secondary uppercase tracking-wider">Our Presence</p>
      <h2 class="mt-2 text-[26px] sm:text-[32px] font-bold text-primary leading-tight">A Network Across Gujarat</h2>
    </div>

    <!-- Anand Region Map -->
    <img src="/assets/anand-map.webp" alt="Anand Network Map" loading="lazy"
      class="mt-10 w-full max-w-[500px] object-contain mix-blend-multiply" />
  </article>

  <!-- Right Column: 6 Cards -->
  <article class="lg:pt-[112px]">
    <ul class="grid list-none gap-3 grid-cols-2 sm:gap-5 lg:grid-cols-3 max-w-[600px]">
      @for (item of breakdown; track item.label; let i = $index) {
      <li
        class="bg-white rounded-lg p-4 text-center hover:shadow-md transition-shadow border border-gray-100 flex flex-col justify-center">
        <div class="flex justify-center mb-3 mx-auto">
          <div class="flex h-12 w-12 items-center justify-center rounded-full" [class]="'flex h-12 w-12 items-center justify-center rounded-full ' + (
                i === 0 ? 'bg-orange-100' :
                i === 1 ? 'bg-green-100' :
                i === 2 ? 'bg-purple-100' :
                i === 3 ? 'bg-pink-100' :
                i === 4 ? 'bg-blue-100' :
                'bg-yellow-100'
              )">
            <span [class]="
                  i === 0 ? 'text-orange-500' :
                  i === 1 ? 'text-green-500' :
                  i === 2 ? 'text-purple-500' :
                  i === 3 ? 'text-pink-500' :
                  i === 4 ? 'text-blue-500' :
                  'text-yellow-500'
                " class="material-symbols-outlined !text-[23px] [font-variation-settings:'wght'_300]"
              aria-hidden="true">{{ item.icon }}</span>
          </div>
        </div>

        <p class="text-[24px] leading-tight font-bold text-primary mb-2">{{ item.value }}</p>

        <div class="h-1 w-10 mx-auto mb-3 rounded-full" [class]="
              i === 0 ? 'h-1 w-10 mx-auto mb-3 rounded-full bg-orange-500' :
              i === 1 ? 'h-1 w-10 mx-auto mb-3 rounded-full bg-green-500' :
              i === 2 ? 'h-1 w-10 mx-auto mb-3 rounded-full bg-purple-500' :
              i === 3 ? 'h-1 w-10 mx-auto mb-3 rounded-full bg-pink-500' :
              i === 4 ? 'h-1 w-10 mx-auto mb-3 rounded-full bg-blue-500' :
              'h-1 w-10 mx-auto mb-3 rounded-full bg-yellow-500'
            "></div>

        <p class="text-[13px] font-semibold text-primary">{{ item.label }}</p>
      </li>
      }
    </ul>
  </article>

</section>
