<section class="site-container grid gap-5 pt-5 lg:grid-cols-[1.35fr_1fr]">

  <!-- Map + breakdown -->
  <article class="rounded-xl bg-[#F7F9FC] p-6">
    <p class="text-[12px] font-semibold text-secondary">Our Presence</p>
    <h2 class="mt-1 text-[20px] font-bold text-primary">A Network Across Gujarat</h2>

    <div class="mt-5 grid items-center gap-6 sm:grid-cols-[1fr_1fr]">
      <!-- Halftone region map. Swap in a true Gujarat outline when available. -->
      <svg class="h-[240px] w-full" viewBox="0 0 320 260" fill="none" aria-hidden="true">
        <defs>
          <pattern id="ces-about-dots" width="7" height="7" patternUnits="userSpaceOnUse">
            <circle cx="1.6" cy="1.6" r="1.5" fill="currentColor" class="text-primary/25" />
          </pattern>
          <clipPath id="ces-about-shape">
            <path d="M70 40c30-16 78-18 112-6 26 9 44 4 62 18 14 11 10 30 0 44-8 12-4 26-14 40-12 17-30 32-56 40-22 7-42 2-58-12-14-12-16-28-26-42-12-17-24-30-26-50-2-16 2-26 6-32z" />
          </clipPath>
        </defs>

        <rect width="320" height="260" fill="url(#ces-about-dots)" clip-path="url(#ces-about-shape)" />

        @for (pin of pins; track pin) {
          <g [attr.transform]="'translate(' + pin[0] + ',' + pin[1] + ')'" class="text-secondary">
            <path d="M0-16c-5.4 0-9.8 4.4-9.8 9.8C-9.8 1 0 11 0 11s9.8-10 9.8-17.2C9.8-11.6 5.4-16 0-16z" fill="currentColor" />
            <circle cx="0" cy="-6.2" r="3.2" fill="#fff" />
          </g>
        }
      </svg>

      <ul class="list-none space-y-4">
        @for (item of breakdown; track item.value) {
          <li class="flex items-start gap-3">
            <svg class="mt-0.5 shrink-0 text-primary" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              @for (d of item.path; track d) { <path [attr.d]="d" /> }
            </svg>
            <div>
              <p class="text-[13px] font-bold text-primary">{{ item.value }}</p>
              <p class="text-[12px] text-muted">{{ item.label }}</p>
            </div>
          </li>
        }
      </ul>
    </div>
  </article>

  <!-- By the numbers -->
  <article class="rounded-xl border border-gray-200 bg-white p-6">
    <h2 class="text-center text-[20px] font-bold text-primary">By The Numbers</h2>

    <ul class="mt-5 grid list-none grid-cols-2 gap-4 sm:grid-cols-3">
      @for (item of numbers; track item.label) {
        <li class="rounded-lg bg-[#F7F9FC] px-3 py-5 text-center">
          <svg class="mx-auto text-secondary" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            @for (d of item.path; track d) { <path [attr.d]="d" /> }
          </svg>
          <p class="mt-2.5 text-[19px] leading-tight font-bold text-primary">{{ item.value }}</p>
          <p class="mt-1 text-[11px] text-muted">{{ item.label }}</p>
        </li>
      }
    </ul>
  </article>

</section>
