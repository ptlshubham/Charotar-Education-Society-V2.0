<app-page-hero crumb="Colleges" title="Colleges" tagline="Discover. Learn. " accent="Excel!"
  blurb="CES colleges are committed to academic excellence, innovation and holistic development." [image]="banner"
  [stats]="heroStats" />

<section class="site-container py-8">

  <!-- Stream filters -->
  <app-academic-tabs [tabs]="filters" [active]="active()" ariaLabel="Stream" (tabChange)="select($event)" />

  <!-- Cards -->
  <ul class="animate-dropdown mt-6 grid list-none gap-5 sm:grid-cols-2 lg:grid-cols-3">
    @for (college of visible(); track college.name) {
    <li class="flex flex-col overflow-hidden rounded-xl border border-gray-200 bg-white">
      <div class="relative">
        <img [src]="college.image" [alt]="college.name" loading="lazy"
          class="aspect-[16/9] w-full bg-primary-light object-cover" />
      </div>

      <div class="flex flex-1 flex-col p-5 pt-8">
        <h2 class="text-[15.5px] leading-snug font-bold text-primary">{{ college.name }}</h2>

        <p class="mt-1.5 flex items-center gap-1.5 text-[12px] text-secondary-dark">
          {{ college.location }}
        </p>

        <p class="mt-3 flex-1 text-[12.5px] leading-relaxed text-muted">{{ college.desc }}</p>

        <div class="mt-4 flex items-center justify-between gap-3 border-t border-gray-100 pt-3.5">
          <a [href]="telHref(college.phone)"
            class="inline-flex items-center gap-1.5 text-[12px] text-muted no-underline hover:text-accent">
            {{ college.phone }}
          </a>

          @if (college.website) {
          <a [href]="college.website" target="_blank" rel="noopener noreferrer"
            class="inline-flex items-center gap-1.5 text-[12.5px] font-semibold text-primary no-underline hover:text-accent">
            Visit Website
          </a>
          }
        </div>
      </div>
    </li>
    } @empty {
    <li
      class="col-span-full rounded-lg border border-dashed border-gray-300 bg-[#F7F9FC] px-4 py-10 text-center text-[13px] text-muted">
      No colleges in this stream yet.
    </li>
    }
  </ul>

  <div class="mt-7 text-center">
    <button type="button"
      class="inline-flex items-center gap-2 rounded-md bg-primary px-6 py-3 text-[13.5px] font-semibold text-white transition-colors hover:bg-primary-dark">
      View All Colleges
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6" />
      </svg>
    </button>
  </div>

</section>
