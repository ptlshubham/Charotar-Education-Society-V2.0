<section class="relative min-h-[416px] overflow-hidden bg-gradient-to-r from-[#EEF3FA] via-[#EEF3FA] to-[#DCE6F5]">

  <!-- Dot pattern, top-left -->
  <svg class="pointer-events-none absolute top-6 left-4 h-24 w-32" aria-hidden="true">
    <defs>
      <pattern id="ces-alumni-dots" width="14" height="14" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.6" fill="currentColor" class="text-primary/20" />
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#ces-alumni-dots)" />
  </svg>

  <div class="relative mx-auto grid max-w-[1600px] items-center gap-8 px-5 py-12 sm:px-8 lg:grid-cols-[1fr_1fr] lg:px-10 lg:py-14">

    <!-- Copy -->
    <div class="relative z-10">
      <p class="text-[22px] leading-snug font-medium text-primary sm:text-[28px]">
        Once a student,<br />
        always a part of the
      </p>

      <h1 class="mt-1 text-[54px] leading-none font-bold tracking-tight text-primary sm:text-[76px]">Legacy</h1>

      <p class="mt-5 text-[15px] font-medium text-muted">Reconnect. Contribute. Inspire.</p>
    </div>

    <!-- Campus photo with the curved red edge -->
    <div class="relative">
      <span class="pointer-events-none absolute -top-6 -right-6 hidden h-[112%] w-[70%] rounded-l-[999px] bg-logo/85 lg:block" aria-hidden="true"></span>
      <img [src]="campus" alt="Charotar Education Society campus" loading="lazy"
        class="relative w-full rounded-lg bg-primary-light object-cover lg:h-[300px] lg:rounded-none" />
      <!-- Soft blue blob echoing the design -->
      <span class="pointer-events-none absolute -bottom-8 -left-10 hidden h-28 w-28 rounded-full bg-primary/25 lg:block" aria-hidden="true"></span>
    </div>

  </div>
</section>
