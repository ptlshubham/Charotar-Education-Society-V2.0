<section class="mx-auto max-w-[1600px] px-4 pb-10 sm:px-6 lg:px-10">

  <div class="flex flex-wrap items-start justify-between gap-4">
    <div>
      <h2 class="text-[22px] font-bold text-primary sm:text-[26px]">Centenary Celebration With Celebrity</h2>
      <span class="mt-3 block h-1 w-16 rounded-full bg-secondary" aria-hidden="true"></span>
    </div>

    <a routerLink="/glory/gallery"
      class="inline-flex items-center gap-2 rounded-md border border-gray-300 px-4 py-2.5 text-[13px] font-semibold text-primary no-underline transition-colors hover:border-primary hover:bg-primary hover:text-white">
      View All Gallery
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
    </a>
  </div>

  <!-- Mosaic: tall feature + 3x2 grid -->
  <div class="mt-6 grid gap-4 lg:grid-cols-[1fr_2.2fr]">
    <img [src]="feature" alt="Centenary celebration" loading="lazy"
      class="h-full max-h-[430px] w-full rounded-lg bg-primary-light object-cover" />

    <ul class="grid list-none grid-cols-2 gap-4 sm:grid-cols-3">
      @for (tile of tiles; track tile) {
        <li>
          <img [src]="tile" alt="Centenary celebration" loading="lazy"
            class="aspect-[4/3] w-full rounded-lg bg-primary-light object-cover transition-transform duration-300 hover:scale-[1.03]" />
        </li>
      }
    </ul>
  </div>

  <!-- Stat strip -->
  <ul class="mt-8 grid list-none grid-cols-2 gap-y-6 sm:grid-cols-3 lg:grid-cols-5">
    @for (stat of stats; track stat.label) {
      <li class="flex items-center justify-center gap-3">
        <svg class="shrink-0 text-primary" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          @for (d of stat.path; track d) { <path [attr.d]="d" /> }
        </svg>
        <div>
          <p class="text-[18px] leading-tight font-bold text-primary">{{ stat.value }}</p>
          <p class="text-[12px] text-muted">{{ stat.label }}</p>
        </div>
      </li>
    }
  </ul>

</section>
