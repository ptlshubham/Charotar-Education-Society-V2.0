<section class="site-container pt-10 pb-10">

  <div class="text-center">
    <h2 class="text-[22px] font-bold text-primary sm:text-[26px] ">Centenary Celebration With Celebrity</h2>
    <span class="mx-auto mt-3 block h-1 w-16 rounded-full bg-secondary " aria-hidden="true"></span>
  </div>

  <!-- Mosaic: tall feature + 3x2 grid -->
  <div class="mt-10 grid gap-4 lg:grid-cols-[1fr_2.2fr]">
    <img [src]="feature" alt="Centenary celebration" loading="lazy"
      class="h-full max-h-[430px] w-full rounded-lg bg-primary-light object-cover" />

    <ul class="grid list-none grid-cols-2 gap-4 sm:grid-cols-3">
      @for (tile of tiles; track tile) {
        <li>
          <img [src]="tile" alt="Centenary celebration" loading="lazy"
            class="aspect-[4/3] w-full rounded-lg bg-primary-light object-cover transition-transform duration-300 hover:scale-[1.03]" />
        </li>
      }
    </ul>
  </div>
  <div class="mt-8  flex justify-center">
    <a routerLink="/glory/gallery"
      class="inline-flex items-center gap-2 rounded-md bg-primary px-6 py-3 text-[14px] font-semibold text-white no-underline transition-colors hover:bg-primary-dark">
      View All Gallery
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
    </a>
  </div>
