<section class="site-container py-8 lg:py-10" aria-labelledby="gallery-title">

  <!-- Heading -->
  <div class="flex flex-wrap items-end justify-between gap-x-8 gap-y-3">
    <div>
      <p class="text-[12px] font-semibold tracking-[1.5px] text-secondary uppercase sm:text-[13px]">Shatakotsav 2015 – 16</p>
      <h2 id="gallery-title" class="mt-2 text-[24px] leading-[1.15] font-bold tracking-tight text-primary sm:text-[30px] lg:text-[34px]">
        Celebration Gallery
      </h2>
    </div>
    <p class="text-[14px] text-[#5B6472] sm:mb-1 sm:text-[15px]">{{ images.length }} photographs from the centenary year.</p>
  </div>

  <!-- Shatakotsav photo grid - click any photo to open the zoom viewer on the whole set -->
  <ul id="gallery-photos" class="mt-6 grid list-none grid-cols-2 gap-3 sm:grid-cols-4 lg:mt-8">
    @for (img of shown(); track img; let i = $index) {
    <li class="overflow-hidden rounded-lg">
      <button type="button" [id]="'gallery-photo-' + i" (click)="open(i)"
        [attr.aria-label]="'View centenary celebration photo ' + (i + 1)"
        class="group relative block w-full cursor-zoom-in">
        <img [src]="img" alt="Centenary celebration" loading="lazy"
          class="aspect-[4/3] w-full bg-primary-light object-cover transition-transform duration-300 group-hover:scale-105" />
        <span
          class="pointer-events-none absolute inset-0 flex items-center justify-center bg-black/0 opacity-0 transition-all duration-300 group-hover:bg-black/25 group-hover:opacity-100"
          aria-hidden="true">
          <span class="flex h-10 w-10 items-center justify-center rounded-full bg-white/90 text-primary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5M11 8v6M8 11h6" />
            </svg>
          </span>
        </span>
      </button>
    </li>
    }
  </ul>

  <!-- The rest of the set, then (once it is all open) the Society's main gallery -->
  <div class="mt-8 flex justify-center">
    @if (!showAll()) {
    <button type="button" (click)="expand()" aria-expanded="false" aria-controls="gallery-photos"
      class="inline-flex items-center gap-2 rounded-md bg-primary px-6 py-3 text-[14px] font-semibold text-white transition-colors hover:bg-primary-dark">
      View full gallery
      <span class="font-normal text-white/70">({{ images.length }} photos)</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m6 9 6 6 6-6" />
      </svg>
    </button>
    } @else {
    <a routerLink="/glory/gallery"
      class="inline-flex items-center gap-2 rounded-md bg-primary px-6 py-3 text-[14px] font-semibold text-white no-underline transition-colors hover:bg-primary-dark">
      More in the CES photo gallery
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6" />
      </svg>
    </a>
    }
  </div>

</section>
