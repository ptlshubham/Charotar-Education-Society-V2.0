<section class="site-container pt-10 pb-10">

  <div class="text-center">
    <h2 class="text-[22px] font-bold text-primary sm:text-[26px]">Centenary Celebration With Celebrity</h2>
    <span class="mx-auto mt-3 block h-1 w-16 rounded-full bg-secondary" aria-hidden="true"></span>
  </div>

  <!-- Shatakotsav photo grid — click any photo to open the zoom viewer -->
  <ul class="mt-10 grid list-none grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4">
    @for (img of pager.paged(); track $index; let i = $index) {
      <li class="overflow-hidden rounded-lg">
        <button type="button" (click)="open(pager.rangeStart() - 1 + i)"
          [attr.aria-label]="'View centenary celebration photo ' + (pager.rangeStart() + i)"
          class="group relative block w-full cursor-zoom-in">
          <img [src]="img" alt="Centenary celebration" loading="lazy"
            class="aspect-[4/3] w-full bg-primary-light object-cover transition-transform duration-300 group-hover:scale-105" />
          <span class="pointer-events-none absolute inset-0 flex items-center justify-center bg-black/0 opacity-0 transition-all duration-300 group-hover:bg-black/25 group-hover:opacity-100" aria-hidden="true">
            <span class="flex h-10 w-10 items-center justify-center rounded-full bg-white/90 text-primary">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5M11 8v6M8 11h6" /></svg>
            </span>
          </span>
        </button>
      </li>
    }
  </ul>

  <!-- Pagination -->
  @if (pager.totalPages() > 1) {
    <app-pagination [pager]="pager" />
  }

  <div class="mt-8 flex justify-center">
    <a routerLink="/glory/gallery"
      class="inline-flex items-center gap-2 rounded-md bg-primary px-6 py-3 text-[14px] font-semibold text-white no-underline transition-colors hover:bg-primary-dark">
      View All Gallery
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
    </a>
  </div>

</section>

<!-- ─── Lightbox ─── -->
@if (current(); as photo) {
  <div class="fixed inset-0 z-[999] flex flex-col bg-black/90" (click)="close()">

    <!-- Toolbar -->
    <div class="flex items-center justify-between gap-3 px-4 py-3" (click)="$event.stopPropagation()">
      <span class="text-[13px] font-medium text-white/80 tabular-nums">{{ lightboxPosition() }}</span>

      <div class="flex items-center gap-1.5">
        <button type="button" (click)="zoomOut()" [disabled]="zoom() <= 1" aria-label="Zoom out"
          class="flex h-9 w-9 items-center justify-center rounded-full bg-white/15 text-white transition-colors hover:bg-white/25 disabled:cursor-not-allowed disabled:opacity-40">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5M8 11h6" /></svg>
        </button>
        <span class="w-11 text-center text-[12px] tabular-nums text-white/80">{{ zoomPercent() }}</span>
        <button type="button" (click)="zoomIn()" [disabled]="zoom() >= 4" aria-label="Zoom in"
          class="flex h-9 w-9 items-center justify-center rounded-full bg-white/15 text-white transition-colors hover:bg-white/25 disabled:cursor-not-allowed disabled:opacity-40">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5M11 8v6M8 11h6" /></svg>
        </button>
        <button type="button" (click)="resetZoom()" [disabled]="zoom() === 1" aria-label="Reset zoom"
          class="flex h-9 w-9 items-center justify-center rounded-full bg-white/15 text-white transition-colors hover:bg-white/25 disabled:cursor-not-allowed disabled:opacity-40">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9 9 0 0 0-6.4 2.6L3 8" /><path d="M3 3v5h5" /></svg>
        </button>

        <span class="mx-1 h-5 w-px bg-white/25" aria-hidden="true"></span>

        <button type="button" (click)="download()" aria-label="Download image"
          class="flex h-9 w-9 items-center justify-center rounded-full bg-white/15 text-white transition-colors hover:bg-white/25">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" /></svg>
        </button>
        <button type="button" (click)="close()" aria-label="Close viewer"
          class="flex h-9 w-9 items-center justify-center rounded-full bg-white/15 text-white transition-colors hover:bg-white/25">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12" /></svg>
        </button>
      </div>
    </div>

    <!-- Stage -->
    <div class="relative flex min-h-0 flex-1 items-center justify-center overflow-hidden px-2 pb-2 sm:px-16"
      (click)="$event.stopPropagation()" (wheel)="onWheel($event)">

      <button type="button" (click)="prev()" aria-label="Previous image"
        class="absolute top-1/2 left-2 z-10 flex h-11 w-11 -translate-y-1/2 items-center justify-center rounded-full bg-white/15 text-white transition-colors hover:bg-white/25 sm:left-4">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6" /></svg>
      </button>

      <img [src]="photo.src" [alt]="photo.caption" draggable="false"
        class="max-h-full max-w-full touch-none object-contain select-none"
        [class.transition-transform]="!dragging()"
        [class.duration-150]="!dragging()"
        [class.cursor-grab]="zoom() > 1 && !dragging()"
        [class.cursor-grabbing]="dragging()"
        [style.transform]="'translate(' + panX() + 'px,' + panY() + 'px) scale(' + zoom() + ')'"
        (pointerdown)="onPointerDown($event)" (pointermove)="onPointerMove($event)"
        (pointerup)="onPointerUp()" (pointercancel)="onPointerUp()" (dblclick)="toggleZoom()" />

      <button type="button" (click)="next()" aria-label="Next image"
        class="absolute top-1/2 right-2 z-10 flex h-11 w-11 -translate-y-1/2 items-center justify-center rounded-full bg-white/15 text-white transition-colors hover:bg-white/25 sm:right-4">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6" /></svg>
      </button>
    </div>

    <!-- Caption -->
    <div class="px-4 pb-4 text-center" (click)="$event.stopPropagation()">
      <p class="text-[13px] text-white/70">{{ photo.caption }}</p>
    </div>
  </div>
}
