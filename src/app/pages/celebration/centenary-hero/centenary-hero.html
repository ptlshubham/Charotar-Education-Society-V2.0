<section class="relative overflow-hidden bg-primary">

  <div class="absolute inset-0" aria-hidden="true">
    <img [src]="backdrop" alt="" class="h-full w-full object-cover opacity-50" />
    <div class="absolute inset-0 bg-gradient-to-r from-primary via-primary/90 to-primary/50"></div>
  </div>

  <!-- Confetti flecks -->
  <svg class="pointer-events-none absolute inset-0 h-full w-full" viewBox="0 0 1200 460" fill="none" aria-hidden="true">
    @for (fleck of [[80,60],[210,150],[330,40],[520,110],[900,70],[1050,180],[1140,90],[160,330],[420,390],[980,340],[1120,300],[640,30]]; track fleck) {
      <rect [attr.x]="fleck[0]" [attr.y]="fleck[1]" width="7" height="12" rx="2" fill="currentColor"
        class="text-secondary/50" [attr.transform]="'rotate(35 ' + fleck[0] + ' ' + fleck[1] + ')'" />
    }
  </svg>

  <div class="relative mx-auto grid max-w-[1600px] gap-10 px-5 py-12 sm:px-8 lg:grid-cols-[1.1fr_1fr] lg:items-center lg:px-10 lg:py-16">

    <!-- Copy -->
    <div>
      <p class="text-[14px] font-medium text-white/85">Celebrating a Century of Excellence</p>

      <h1 class="mt-3 text-[30px] leading-[1.12] font-bold tracking-tight text-white uppercase sm:text-[40px] lg:text-[46px]">
        Honoring the Past,<br />
        <span class="text-secondary">Shaping the Future</span>
      </h1>

      <p class="mt-4 text-[15px] text-white/80 sm:text-[16px]">
        100 Years of Education, Service, and Empowerment
      </p>

      <!-- Laurel badge -->
      <div class="mt-8 flex items-center gap-3">
        <svg width="120" height="70" viewBox="0 0 120 70" fill="none" aria-label="100 years" role="img">
          <text x="60" y="34" text-anchor="middle" class="fill-secondary" font-size="26" font-weight="700">100</text>
          <text x="60" y="50" text-anchor="middle" class="fill-secondary" font-size="11" letter-spacing="2">YEARS</text>
          <g stroke="currentColor" stroke-width="2" class="text-secondary" fill="none" stroke-linecap="round">
            <path d="M40 12c-14 6-20 22-16 38 2 8 7 14 13 17" />
            <path d="M80 12c14 6 20 22 16 38-2 8-7 14-13 17" />
            <path d="M31 26c-5 1-8 4-9 8M28 38c-5 0-9 2-11 6M31 50c-4 2-6 5-7 9" />
            <path d="M89 26c5 1 8 4 9 8M92 38c5 0 9 2 11 6M89 50c4 2 6 5 7 9" />
          </g>
        </svg>
      </div>
    </div>

    <!-- Pinned photos -->
    <ul class="grid list-none grid-cols-2 gap-4 sm:gap-5">
      @for (photo of polaroids; track photo; let i = $index) {
        <li class="rounded-md bg-white p-1.5 shadow-xl transition-transform duration-300 hover:rotate-0"
          [class]="tilts[i]">
          <img [src]="photo" alt="Centenary celebration moment" loading="lazy"
            class="aspect-[4/3] w-full rounded-sm bg-primary-light object-cover" />
        </li>
      }
    </ul>

  </div>
</section>
