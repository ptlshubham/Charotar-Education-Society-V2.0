<section class="site-container pb-12 mt-10">

  <h2 class="text-center text-[22px] font-bold text-primary sm:text-[26px]">Voices from Our Community</h2>
  <span class="mx-auto mt-3 block h-1 w-16 rounded-full bg-secondary" aria-hidden="true"></span>

  <ul class="mt-7 grid list-none gap-5 sm:grid-cols-2 lg:grid-cols-4">
    @for (voice of voices; track voice.name) {
      <li class="flex flex-col rounded-xl border border-gray-200 bg-white p-5">
        <svg class="shrink-0 text-secondary" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M7 7h4v4c0 3-1.8 5.3-4.5 6L6 15.6c1.3-.4 2-1.3 2-2.6H7a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2zm10 0h4v4c0 3-1.8 5.3-4.5 6L16 15.6c1.3-.4 2-1.3 2-2.6h-1a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z" />
        </svg>

        <p class="mt-3 flex-1 text-[13px] leading-relaxed text-muted">{{ voice.quote }}</p>

        <div class="mt-5 flex items-center gap-3 border-t border-gray-100 pt-4">
          <img [src]="voice.photo" [alt]="voice.name" loading="lazy"
            class="h-10 w-10 shrink-0 rounded-full bg-primary-light object-cover" />
          <div class="min-w-0">
            <p class="text-[13px] font-semibold text-primary">{{ voice.name }}</p>
            <p class="text-[12px] text-muted">{{ voice.role }}</p>
          </div>
        </div>
      </li>
    }
  </ul>

  <div class="mt-8 text-center">
    <a routerLink="/contact"
      class="inline-flex items-center gap-2 rounded-md bg-primary px-6 py-3 text-[14px] font-semibold text-white no-underline transition-colors hover:bg-primary-dark">
      Share Your Experience
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
    </a>
  </div>

</section>
