<section class="site-container py-12">
  <ul class="grid list-none gap-5 lg:grid-cols-3">
    @for (card of cards; track card.title) {
      <li class="flex items-start gap-4 rounded-xl border border-gray-200 bg-white p-6">
        <span class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-primary text-white" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            @for (d of card.path; track d) { <path [attr.d]="d" /> }
          </svg>
        </span>

        <div class="min-w-0">
          <h2 class="text-[16px] font-bold text-primary">{{ card.title }}</h2>

          @if (card.href) {
            <a [href]="card.href" class="mt-1.5 block text-[14px] break-words text-muted no-underline transition-colors hover:text-accent">
              @for (line of card.lines; track line) { {{ line }} }
            </a>
          } @else {
            <p class="mt-1.5 text-[14px] leading-relaxed text-muted">
              @for (line of card.lines; track line) {
                {{ line }}<br />
              }
            </p>
          }
        </div>
      </li>
    }
  </ul>
</section>
