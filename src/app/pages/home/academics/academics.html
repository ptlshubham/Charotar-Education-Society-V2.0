<section class="mx-auto max-w-[1600px] px-4 py-14 sm:px-6 lg:px-10">

  <div class="mb-8 flex flex-wrap items-end justify-between gap-4">
    <h2 class="text-[24px] font-bold text-primary sm:text-[30px]">Explore Academic Opportunities</h2>
    <a routerLink="/academic/school"
      class="inline-flex shrink-0 items-center gap-1.5 text-[14px] font-semibold text-accent no-underline hover:text-primary">
      View All Programs
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
    </a>
  </div>

  <ul class="grid list-none grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-5">
    @for (o of opportunities; track o.title) {
      <li>
        <a [routerLink]="o.link"
          class="flex h-full items-start gap-3.5 rounded-xl border border-gray-200 bg-white p-5 no-underline transition-all hover:-translate-y-0.5 hover:border-accent/50 hover:shadow-[0_10px_28px_rgba(32,49,84,0.10)]">
          <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-lg bg-accent/10 text-accent" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              @for (d of o.path; track d) { <path [attr.d]="d" /> }
            </svg>
          </span>
          <div>
            <h3 class="text-[15px] font-bold text-primary">{{ o.title }}</h3>
            <p class="mt-1 text-[12.5px] leading-snug text-muted">{{ o.sub }}</p>
          </div>
        </a>
      </li>
    }
  </ul>

</section>
