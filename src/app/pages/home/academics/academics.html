<section class="bg-white py-14 sm:py-20" aria-labelledby="programmes-title">
  <div class="site-container">

    <!-- Header - set like the other home sections -->
    <div class="mb-9 flex flex-col items-center text-center">
      <!-- <span class="mb-5 block h-1 w-12 rounded-full bg-secondary" aria-hidden="true"></span> -->
      <span class="text-[12px] font-semibold tracking-[2px] text-secondary uppercase sm:text-[14px]">Our Programmes</span>
      <h2 id="programmes-title" class="mt-3 text-[28px] leading-[1.1] font-semibold text-primary sm:text-[36px] lg:text-[40px]">
        Find Your Perfect Programme.
      </h2>
      <span class="mt-5 block h-1 w-12 rounded-full bg-secondary" aria-hidden="true"></span>
    </div>

    <!-- Level tabs: the site's tab row (shared/tab-bar) -->
    <app-tab-bar class="mb-8 block" [tabs]="tabItems" [active]="active().level" ariaLabel="Programme level"
      controls="programme-cards" (tabChange)="select($event)" />

    <!-- Programme cards -->
    <!-- Wide cards, two to a row (a lone card sits centred). Every card is one fixed height, so
         nothing jumps when the tab changes, whatever the length of the name. -->
    <ul id="programme-cards" role="tabpanel" [attr.aria-label]="active().label + ' programmes'"
      class="grid list-none gap-5 p-0 lg:gap-6"
      [class]="visible().length === 1 ? 'mx-auto max-w-[760px]' : 'lg:grid-cols-2'">
      @for (course of visible(); track course.id) {
      <li class="course-card">
        <a [routerLink]="active().link"
          class="group relative grid h-[128px] grid-cols-[38%_minmax(0,1fr)] grid-rows-1 overflow-hidden rounded-xl border border-[#E6E9EF] bg-white no-underline shadow-[0_6px_20px_-14px_rgba(32,49,84,0.3)] transition duration-200 hover:border-[#D5E2F3] focus:outline-none focus-visible:ring-2 focus-visible:ring-secondary sm:h-[152px] sm:grid-cols-[40%_minmax(0,1fr)]">
          <!-- Gold bar down the left edge on hover/focus -->
          <span class="absolute inset-y-0 left-0 z-10 w-1 origin-center scale-y-0 bg-secondary transition-transform duration-200 group-hover:scale-y-100 group-focus-visible:scale-y-100"
            aria-hidden="true"></span>

          <img [src]="course.image" alt="" loading="lazy" class="h-full w-full bg-primary-light object-cover" />

          <div class="flex min-w-0 items-center gap-3 px-4 transition-colors group-hover:bg-[#F1F6FD] group-focus-visible:bg-[#F1F6FD] sm:gap-4 sm:px-7">
            <div class="min-w-0 flex-1">
              <p class="text-[11px] font-semibold tracking-[2px] text-secondary uppercase sm:text-[12px]">{{ course.short }}</p>
              <h3 class="mt-1 line-clamp-2 text-[15px] leading-snug font-semibold text-primary sm:mt-1.5 sm:text-[19px]">{{ course.name }}</h3>
              <span class="mt-1.5 inline-block text-[13px] text-muted underline-offset-4 group-hover:underline sm:mt-2 sm:text-[14px]">
                Explore programme
              </span>
            </div>
            <span
              class="hidden h-10 w-10 shrink-0 items-center justify-center rounded-full border-2 border-primary text-primary transition-colors group-hover:bg-primary group-hover:text-white sm:flex"
              aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14M13 6l6 6-6 6" />
              </svg>
            </span>
          </div>
        </a>
      </li>
      }
    </ul>

    <!-- Footer button: the page for the level in view -->
    <div class="mt-10 flex justify-center">
      <a [routerLink]="active().link"
        class="inline-flex items-center gap-2 rounded-lg bg-primary px-8 py-3.5 text-[15px] font-semibold text-white no-underline transition-colors hover:bg-primary-dark focus:outline-none focus-visible:ring-2 focus-visible:ring-secondary">
        View All Programmes
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </a>
    </div>

  </div>
</section>
