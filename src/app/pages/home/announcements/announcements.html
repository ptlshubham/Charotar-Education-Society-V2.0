<section class="site-container grid gap-5 pb-12 lg:grid-cols-[1.55fr_1fr]">

  <!-- Announcements -->
  <div class="rounded-xl border border-primary/15 bg-white p-6">

    <div class="flex flex-wrap items-center justify-between gap-3">
      <h2 class="text-[17px] font-bold text-primary">Today's Announcements</h2>
      <a href="#" class="inline-flex items-center gap-1.5 text-[13px] font-semibold text-primary no-underline hover:text-accent">
        View All Announcements
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
      </a>
    </div>

    <ul class="mt-4 max-h-[250px] list-none space-y-1 overflow-y-auto pr-2">
      @for (item of announcements; track item.text) {
        <li class="flex gap-3 border-b border-gray-100 py-3 last:border-b-0">
          <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-primary/8 text-primary" aria-hidden="true">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><path d="M14 2v6h6" />
            </svg>
          </span>

          <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-center gap-2">
              <span class="rounded px-2 py-0.5 text-[10px] font-bold tracking-wide uppercase" [class]="tagClass(item.tag)">{{ item.tag }}</span>
              <span class="text-[11px] text-muted">{{ item.date }}</span>
            </div>
            <p class="mt-1 text-[13px] leading-relaxed text-muted">{{ item.text }}</p>
            <a href="#" class="mt-1 inline-block text-[12px] font-semibold text-primary no-underline hover:text-accent">Read More →</a>
          </div>
        </li>
      }
    </ul>

  </div>

  <!-- Inline Sarthi — a shopfront for the floating assistant, not a second chat. -->
  <div class="flex flex-col rounded-xl bg-primary p-6">
    <p class="text-[16px] font-semibold text-white">Hi! I'm Sarthi 👋</p>
    <p class="mt-1 text-[13px] text-white/70">How can I assist you today?</p>

    <div class="mt-5 flex flex-1 flex-wrap content-start gap-2">
      @for (topic of topics; track topic.label) {
        <button type="button" (click)="askTopic(topic.prompt)"
          class="rounded-md bg-white/10 px-3 py-2 text-[12px] font-medium text-white transition-colors hover:bg-white/20">
          {{ topic.label }}
        </button>
      }
    </div>

    <form (ngSubmit)="send()"
      class="mt-5 flex items-center gap-2 rounded-lg border border-white/20 bg-white/5 py-2 pr-2 pl-4 focus-within:border-white/50">
      <label for="bot-draft" class="sr-only">Ask Sarthi a question</label>
      <input id="bot-draft" name="draft" [(ngModel)]="draft" type="text" placeholder="Type your message..."
        class="min-w-0 flex-1 bg-transparent text-[13px] text-white outline-none placeholder:text-white/45" />
      <button type="submit" aria-label="Send message"
        class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-secondary text-primary transition-opacity hover:opacity-90">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z" />
        </svg>
      </button>
    </form>
  </div>

</section>
