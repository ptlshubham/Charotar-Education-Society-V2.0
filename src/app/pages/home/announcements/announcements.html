<section class="site-container pb-12">

  <!-- Announcements -->
  <div class="rounded-xl border border-primary/15 bg-white p-6">

    <div class="flex flex-wrap items-center justify-between gap-3">
      <h2 class="text-[17px] font-bold text-primary">Today's Announcements</h2>
      <a href="#" class="inline-flex items-center gap-1.5 text-[13px] font-semibold text-primary no-underline hover:text-accent">
        View All Announcements
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
      </a>
    </div>

    <ul class="mt-4 list-none space-y-1 pr-2 md:max-h-[250px] md:overflow-y-auto">
      @for (item of announcements; track item.text) {
        <li class="flex gap-3 border-b border-gray-100 py-3 last:border-b-0">
          <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-primary/8 text-primary" aria-hidden="true">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><path d="M14 2v6h6" />
            </svg>
          </span>

          <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-center gap-2">
              <span class="rounded px-2 py-0.5 text-[10px] font-bold tracking-wide uppercase" [class]="tagClass(item.tag)">{{ item.tag }}</span>
              <span class="text-[11px] text-muted">{{ item.date }}</span>
            </div>
            <p class="mt-1 text-[13px] leading-relaxed text-muted">{{ item.text }}</p>
            <a href="#" class="mt-1 inline-block text-[12px] font-semibold text-primary no-underline hover:text-accent">Read More →</a>
          </div>
        </li>
      }
    </ul>

  </div>

</section>
