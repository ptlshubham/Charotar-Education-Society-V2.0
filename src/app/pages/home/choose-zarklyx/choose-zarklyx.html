<div
  class="min-h-screen relative w-full lg:w-[94%] xl:w-[95%] flex flex-col justify-start items-center  bg-[#000000] overflow-hidden rounded-r-[80px] pb-12 md:py-8 lg:py-12">
  <img loading="lazy" decoding="async" src="/assets/images/choose-zarklyx-gradient.svg" alt="Gradient background"
    class="absolute top-0 left-0 md:top-[-5%] lg:top-[-2%] xl:top-[-4%]">
  <!-- Torch wrapper: spans the whole dark band (heading row + Z row). Mouse is
       tracked here so the entire area reveals the hidden words. -->
  <div class="w-full relative" (mousemove)="onTorchMove($event)" (mouseleave)="onTorchLeave()">

    <!-- Hidden teal words (desktop only). pointer-events-none so the button stays
         clickable; sits behind the heading (z-3) so headings/Z stay on top. -->
    <div #torchLayer class="torch-layer hidden lg:block absolute inset-0 z-3 select-none pointer-events-none">
      @for (word of torchWords; track $index) {
      <span class="absolute whitespace-nowrap text-[28px] font-medium" [style.left]="word.left"
        [style.top]="word.top">{{ word.text }}</span>
      }
    </div>

    <div class="w-full relative flex flex-col justify-center items-start z-20 mt-25 gap-10 px-5 md:px-10 lg:px-17.5">
      <h2 class="text-white text-[34px] md:text-[40px] lg:text-[36px] font-medium md:w-[60%] lg:w-[40%]">Manage your
        entire
        business on ZarklyX.</h2>
      <p class="text-white text-[16px] font-normal md:w-[60%] lg:w-[45%]">Tell us about your agency and we'll recommend
        the
        right ZarklyX plan for your team size, client load, and workflow  in seconds.</p>
      <button type="button" routerLink="/pricing"
        class="w-44 h-12 border-2 border-white rounded-lg  text-white font-semibold text-[16px] xl:hover:bg-white xl:hover:text-black xl:hover:cursor-pointer transition-discrete duration-150">
        View Plan
      </button>
    </div>
    <div
      class="w-full h-auto relative flex flex-col items-end lg:mt-[-26%] xl:mt-[-18%] z-4 pointer-events-none select-none">
      <img loading="lazy" decoding="async" src="/assets/images/z 1.png" alt="ZarklyX Z monogram" draggable="false" class="">
      <img loading="lazy" decoding="async" src="/assets/images/Ellipse 248.png" alt="Decorative circle" draggable="false"
        class=" mt-[-40%] md:mt-[-16%] lg:mt-[-10%]">
    </div>
  </div>
