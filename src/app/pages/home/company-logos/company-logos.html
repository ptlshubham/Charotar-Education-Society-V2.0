<div class="py-16 md:py-20  w-full flex justify-center items-center overflow-hidden">
  <div class="marquee-mask w-full overflow-hidden cursor-grab active:cursor-grabbing touch-pan-y select-none"
    (pointerdown)="onPointerDown($event)" (pointermove)="onPointerMove($event)" (pointerup)="onPointerUp()"
    (pointercancel)="onPointerUp()">
    <div #marqueeTrack class="flex items-center w-max will-change-transform">
      @for (logo of logos; track 'a-' + $index) {
      <img loading="lazy" decoding="async" [src]="logo.src" [alt]="logo.alt" draggable="false"
        class="h-24 md:h-22 xl:h-38 w-auto object-contain mx-8 md:mx-12 xl:mx-6 shrink-0 select-none pointer-events-none" />
      }
      @for (logo of logos; track 'b-' + $index) {
      <img loading="lazy" decoding="async" [src]="logo.src" [alt]="logo.alt" aria-hidden="true" draggable="false"
        class="h-24 md:h-22 xl:h-38 w-auto object-contain mx-8 md:mx-12 xl:mx-6 shrink-0 select-none pointer-events-none" />
      }
    </div>
  </div>
</div>
