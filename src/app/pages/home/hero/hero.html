<!-- Full-width banner slider. Each slide is a fully-designed banner image (text
     baked in), so there is no HTML overlay. Desktop (1920×520) and mobile
     (1080×1350) crops are art-directed via <picture>; the slide's aspect ratio
     matches each crop so nothing is ever cut off. Slides come from the server
     (ResourcesService.getSliderBanners) with built-in fallback banners. -->
<section class="relative w-full overflow-hidden bg-primary">

  <swiper-container init="false" #swiperEl class="hero-swiper block w-full">
    @for (b of banners(); track b.desktop; let i = $index; let first = $first) {
      <swiper-slide [class.pre-hide]="!swiperReady() && !first">
        @if (b.link) {
          <a [routerLink]="b.link" class="block no-underline">
            <picture>
              <source media="(min-width: 768px)" [srcset]="b.desktop" />
              <img [src]="b.mobile" [alt]="b.alt"
                [attr.fetchpriority]="i === 0 ? 'high' : null" [attr.loading]="i === 0 ? null : 'lazy'"
                class="block w-full object-cover aspect-[1080/1350] md:aspect-[1920/520]" />
            </picture>
          </a>
        } @else {
          <picture>
            <source media="(min-width: 768px)" [srcset]="b.desktop" />
            <img [src]="b.mobile" [alt]="b.alt"
              [attr.fetchpriority]="i === 0 ? 'high' : null" [attr.loading]="i === 0 ? null : 'lazy'"
              class="block w-full object-cover aspect-[1080/1350] md:aspect-[1920/520]" />
          </picture>
        }
      </swiper-slide>
    }
  </swiper-container>

  @if (banners().length > 1) {
    <!-- Prev / Next arrows. -->
    <button type="button" (click)="prev()" aria-label="Previous banner"
      class="absolute top-1/2 left-3 z-20 flex h-11 w-11 -translate-y-1/2 items-center justify-center rounded-full bg-white/90 text-primary shadow-lg transition-colors hover:bg-white lg:left-5">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6" /></svg>
    </button>
    <button type="button" (click)="next()" aria-label="Next banner"
      class="absolute top-1/2 right-3 z-20 flex h-11 w-11 -translate-y-1/2 items-center justify-center rounded-full bg-white/90 text-primary shadow-lg transition-colors hover:bg-white lg:right-5">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6" /></svg>
    </button>

    <!-- Pagination dots. -->
    <div class="absolute bottom-4 left-1/2 z-20 flex -translate-x-1/2 gap-2">
      @for (b of banners(); track b.desktop; let i = $index) {
        <button type="button" (click)="goTo(i)" [attr.aria-label]="'Go to banner ' + (i + 1)"
          class="h-2.5 rounded-full transition-all duration-300"
          [class]="activeIndex() === i ? 'w-6 bg-secondary' : 'w-2.5 bg-white/60 hover:bg-white/90'"></button>
      }
    </div>
  }

</section>
