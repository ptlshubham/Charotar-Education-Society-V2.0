<section class="mx-auto max-w-[1600px] px-4 pt-4 sm:px-6 lg:px-10">

  <div class="relative overflow-hidden rounded-2xl bg-primary">

    <!-- Campus imagery sits behind the copy; the gradient keeps text legible over any photo. -->
    <div class="absolute inset-0" aria-hidden="true">
      @if (heroImage()) {
        <img [src]="heroImage()" alt="" class="h-full w-full object-cover" />
      } @else {
        <div class="h-full w-full bg-primary-light">
          <svg class="absolute right-0 bottom-0 h-[85%] w-auto text-white/[0.06]" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M3 21h18v-2H3v2zM5 19V9l7-5 7 5v10h-4v-6h-6v6H5z" />
          </svg>
        </div>
      }
      <div class="absolute inset-0 bg-gradient-to-r from-primary via-primary/95 to-primary/40 lg:to-transparent"></div>
    </div>

    <div class="relative flex flex-col gap-8 px-6 py-12 sm:px-10 lg:min-h-[460px] lg:py-16">

      <!-- Circular video affordance, top-right -->
      <button type="button" aria-label="Play the campus video"
        class="absolute top-8 right-8 hidden h-14 w-14 items-center justify-center rounded-full border-2 border-white/70 text-white transition-colors hover:bg-white hover:text-primary lg:flex">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M8 5v14l11-7z" />
        </svg>
      </button>

      <div class="max-w-xl">
        <h1 class="text-[32px] leading-[1.15] font-bold text-white sm:text-[42px] lg:text-[46px]">
          Empowering Generations.<br />
          <span class="text-secondary">Building Tomorrow.</span>
        </h1>

        <p class="mt-5 max-w-md text-[15px] leading-relaxed text-white/80">
          A legacy of 110+ years in quality education through 31+ institutes across diverse domains.
        </p>

        <div class="mt-8 flex flex-wrap items-center gap-3">
          <a routerLink="/academic/school"
            class="inline-flex items-center gap-2 rounded-md bg-secondary px-6 py-3.5 text-[15px] font-semibold text-primary no-underline transition-colors hover:bg-secondary-dark">
            Explore Our Institutes
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h14M13 6l6 6-6 6" />
            </svg>
          </a>

          <a routerLink="/about"
            class="inline-flex items-center rounded-md border border-white/40 px-6 py-3.5 text-[15px] font-semibold text-white no-underline transition-colors hover:bg-white/10">
            About CES
          </a>
        </div>
      </div>

      <!-- Video affordance -->
      <button type="button"
        class="group inline-flex w-fit items-center gap-3 rounded-full bg-white/10 py-2 pr-5 pl-2 text-[14px] font-medium text-white backdrop-blur transition-colors hover:bg-white/20 lg:absolute lg:right-8 lg:bottom-10">
        <span class="flex h-11 w-11 items-center justify-center rounded-full bg-white text-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8 5v14l11-7z" />
          </svg>
        </span>
        Play Video
      </button>

    </div>
  </div>

  <!-- ─── Search card ─── -->
  <div class="relative z-10 mx-auto -mt-7 max-w-4xl rounded-xl bg-white p-3 shadow-[0_10px_40px_rgba(32,49,84,0.14)]">
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center">

      <div class="flex min-w-0 flex-1 items-center gap-2.5 px-3">
        <svg class="shrink-0 text-gray-400" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
        </svg>
        <label for="hero-search" class="sr-only">Search institutes, programs, courses</label>
        <input id="hero-search" type="search" placeholder="Search Institutes, Programs, Courses..."
          class="min-w-0 flex-1 py-2.5 text-[15px] text-primary outline-none placeholder:text-gray-400" />
      </div>

      <span class="hidden h-8 w-px bg-gray-200 sm:block" aria-hidden="true"></span>

      <label for="hero-category" class="sr-only">Category</label>
      <select id="hero-category"
        class="w-full shrink-0 rounded-md px-3 py-2.5 text-[15px] text-muted outline-none sm:w-auto">
        @for (category of categories; track category) {
          <option>{{ category }}</option>
        }
      </select>

      <button type="button"
        class="shrink-0 rounded-md bg-primary px-8 py-3 text-[15px] font-semibold text-white transition-colors hover:bg-primary-dark">
        Search
      </button>

    </div>
  </div>

</section>
