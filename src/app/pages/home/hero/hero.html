<section>

  <!-- Full-bleed hero band: spans the viewport edge-to-edge, no rounding.
       The whole band is a slider — autoplay pauses while the pointer is over it. -->
  <div class="relative overflow-hidden bg-primary" (mouseenter)="stop()" (mouseleave)="start()">

    <!-- Slide backgrounds crossfade behind the copy; the gradient keeps text legible over any photo. -->
    <div class="absolute inset-0 bg-primary-light" aria-hidden="true">
      @for (slide of slides; track slide.image; let i = $index) {
        <img [src]="slide.image" alt=""
          class="absolute inset-0 h-full w-full object-cover transition-opacity duration-700 ease-out"
          [class.opacity-100]="active() === i" [class.opacity-0]="active() !== i" />
      }
      <div class="absolute inset-0 bg-gradient-to-r from-primary via-primary/95 to-primary/40 lg:to-transparent"></div>
    </div>

    <!-- Copy stays aligned to the page gutter, matching every section below. -->
    <div class="relative mx-auto flex max-w-[1600px] flex-col gap-8 px-4 py-12 sm:px-6 lg:min-h-[520px] lg:px-10 lg:py-20 lg:pb-28">

      <!-- Circular video affordance, top-right -->
      <button type="button" aria-label="Play the campus video"
        class="absolute top-10 right-4 hidden h-14 w-14 items-center justify-center rounded-full border-2 border-white/70 text-white transition-colors hover:bg-white hover:text-primary sm:right-6 lg:right-10 lg:flex">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M8 5v14l11-7z" />
        </svg>
      </button>

      <div class="max-w-xl">
        <!-- Keyed on the active index so the heading + blurb replay their fade on each slide. -->
        @for (slide of [current()]; track active()) {
          <div class="animate-dropdown">
            <h1 class="text-[32px] leading-[1.15] font-bold text-white sm:text-[42px] lg:text-[46px]">
              {{ slide.lead }}<br />
              <span class="text-secondary">{{ slide.accent }}</span>
            </h1>

            <p class="mt-5 max-w-md text-[15px] leading-relaxed text-white/80">
              {{ slide.blurb }}
            </p>
          </div>
        }

        <div class="mt-8 flex flex-wrap items-center gap-3">
          <a routerLink="/academic/school"
            class="inline-flex items-center gap-2 rounded-md bg-secondary px-6 py-3.5 text-[15px] font-semibold text-primary no-underline transition-colors hover:bg-secondary-dark">
            Explore Our Institutes
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h14M13 6l6 6-6 6" />
            </svg>
          </a>

          <a routerLink="/about"
            class="inline-flex items-center rounded-md border border-white/40 px-6 py-3.5 text-[15px] font-semibold text-white no-underline transition-colors hover:bg-white/10">
            About CES
          </a>
        </div>

        <!-- Slider controls -->
        <div class="mt-9 flex items-center gap-4">
          <button type="button" (click)="prev()" aria-label="Previous slide"
            class="flex h-9 w-9 items-center justify-center rounded-full border border-white/30 text-white transition-colors hover:bg-white hover:text-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
          </button>

          <div class="flex items-center gap-2.5">
            @for (slide of slides; track slide.image; let i = $index) {
              <button type="button" (click)="select(i)" [attr.aria-label]="'Go to slide ' + (i + 1)"
                [attr.aria-current]="active() === i"
                class="h-2 rounded-full transition-all duration-300"
                [class]="active() === i ? 'w-8 bg-secondary' : 'w-2 bg-white/40 hover:bg-white/70'"></button>
            }
          </div>

          <button type="button" (click)="next()" aria-label="Next slide"
            class="flex h-9 w-9 items-center justify-center rounded-full border border-white/30 text-white transition-colors hover:bg-white hover:text-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
          </button>
        </div>
      </div>

      <!-- Video affordance -->
      <button type="button"
        class="group inline-flex w-fit items-center gap-3 rounded-full bg-white/10 py-2 pr-5 pl-2 text-[14px] font-medium text-white backdrop-blur transition-colors hover:bg-white/20 lg:absolute lg:right-10 lg:bottom-14">
        <span class="flex h-11 w-11 items-center justify-center rounded-full bg-white text-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8 5v14l11-7z" />
          </svg>
        </span>
        Play Video
      </button>

    </div>
  </div>

  <!-- ─── Search card ─── overlaps the hero's bottom edge -->
  <div class="relative z-10 mx-auto -mt-7 max-w-4xl rounded-xl bg-white p-3 shadow-[0_10px_40px_rgba(32,49,84,0.14)] max-lg:mx-4">
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center">

      <div class="flex min-w-0 flex-1 items-center gap-2.5 px-3">
        <svg class="shrink-0 text-gray-400" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
        </svg>
        <label for="hero-search" class="sr-only">Search institutes, programs, courses</label>
        <input id="hero-search" type="search" placeholder="Search Institutes, Programs, Courses..."
          class="min-w-0 flex-1 py-2.5 text-[15px] text-primary outline-none placeholder:text-gray-400" />
      </div>

      <span class="hidden h-8 w-px bg-gray-200 sm:block" aria-hidden="true"></span>

      <label for="hero-category" class="sr-only">Category</label>
      <select id="hero-category"
        class="w-full shrink-0 rounded-md px-3 py-2.5 text-[15px] text-muted outline-none sm:w-auto">
        @for (category of categories; track category) {
          <option>{{ category }}</option>
        }
      </select>

      <button type="button"
        class="shrink-0 rounded-md bg-primary px-8 py-3 text-[15px] font-semibold text-white transition-colors hover:bg-primary-dark">
        Search
      </button>

    </div>
  </div>

</section>
