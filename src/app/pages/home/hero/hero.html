<section class="relative overflow-hidden bg-gradient-to-b from-[#EEF2F9] to-white lg:min-h-[540px]">

  <!-- Campus photo — full-bleed to the right edge, spanning the hero height. -->
  <div class="relative h-[300px] sm:h-[380px] lg:absolute lg:inset-y-0 lg:right-0 lg:h-full lg:w-[62%]">
    <img [src]="image" alt="Charotar Education Society campus — D.N. High School, Anand" fetchpriority="high"
      class="h-full w-full object-cover object-right" />
    <!-- Fade the photo into the light background so the copy stays legible. -->
    <span class="pointer-events-none absolute inset-0 bg-gradient-to-r from-white via-white/45 to-transparent lg:via-white/10" aria-hidden="true"></span>
    <span class="pointer-events-none absolute inset-0 bg-gradient-to-t from-white/70 to-transparent lg:hidden" aria-hidden="true"></span>
  </div>

  <!-- Copy -->
  <div class="relative mx-auto flex max-w-[1600px] flex-col justify-center px-4 py-10 sm:px-6 lg:min-h-[540px] lg:px-10 lg:py-16">
    <div class="lg:max-w-[48%]">
      <h1 class="font-bold">
        <span class="block text-[62px] leading-none text-accent sm:text-[80px] lg:text-[92px]">110+</span>
        <span class="mt-2 block text-[30px] leading-[1.1] tracking-tight text-primary sm:text-[38px] lg:text-[44px]">
          YEARS OF<br />SHAPING FUTURES
        </span>
      </h1>

      <p class="mt-6 max-w-md text-[15px] leading-relaxed text-muted">
        A legacy of education, excellence and opportunity across generations.
      </p>

      <div class="mt-8 flex flex-wrap items-center gap-3">
        <a routerLink="/about"
          class="inline-flex items-center gap-2 rounded-md bg-primary px-6 py-3.5 text-[15px] font-semibold text-white no-underline transition-colors hover:bg-primary-dark">
          Explore CES
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
        </a>
        <a routerLink="/academic/school"
          class="inline-flex items-center rounded-md border border-gray-300 bg-white/80 px-6 py-3.5 text-[15px] font-semibold text-primary no-underline backdrop-blur-sm transition-colors hover:border-primary hover:bg-primary hover:text-white">
          Explore Institutes
        </a>
      </div>

      <div class="mt-9 inline-flex items-center gap-3">
        <span class="flex h-10 w-10 items-center justify-center rounded-full bg-secondary/15 text-secondary-dark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="9" r="6" /><path d="m8.2 14-1.4 7 5.2-2.6L17.2 21l-1.4-7" />
          </svg>
        </span>
        <span class="text-[13px] font-bold tracking-[0.12em] text-muted uppercase">110+ Years of Education</span>
      </div>
    </div>
  </div>

</section>
