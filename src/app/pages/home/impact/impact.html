<section class="site-container py-14" aria-roledescription="carousel" aria-label="Alumni stories"
  (mouseenter)="stopAutoSlide()" (mouseleave)="startAutoSlide()" 
  (focusin)="stopAutoSlide()" (focusout)="startAutoSlide()">
  <div class="flex flex-col gap-10">

    <!-- Heading -->
    <div class="text-center">
      <h2 class="text-[24px] font-bold text-primary sm:text-[30px]">From CES to the World</h2>
      <span class="mx-auto mt-3 block h-1 w-16 rounded-full bg-secondary" aria-hidden="true"></span>
      <p class="mx-auto mt-4 max-w-2xl text-[14px] leading-relaxed text-muted">
        Real stories. Real impact. Our students and alumni making a difference everywhere.
      </p>
    </div>

    <!-- Testimonials Carousel -->
    <div class="carousel-viewport relative overflow-hidden">
      <div class="carousel-track flex transition-transform duration-700 ease-in-out items-stretch gap-5"
        [style.transform]="'translateX(calc(-' + (currentPage * 100) + '% - ' + (currentPage * 20) + 'px))'"
        aria-live="off">
        @for (t of testimonials; track t.name) {
          <div class="testimonial-card flex-none flex flex-col justify-between rounded-2xl border border-gray-100 bg-white p-6 shadow-sm" role="group" aria-roledescription="slide">
            <blockquote class="text-[14px] leading-relaxed text-muted italic mb-5">&ldquo;{{ t.quote }}&rdquo;</blockquote>
            <div class="mt-auto">
              <p class="text-[14.5px] font-bold text-primary">{{ t.name }}</p>
              <p class="mt-0.5 text-[12.5px] text-muted">{{ t.role }}</p>
            </div>
          </div>
        }
      </div>
    </div>

    <!-- Pagination Dots -->
    <div class="flex justify-center gap-2 mt-2" role="tablist">
      @for (page of pages; track page) {
        <button class="dot h-2.5 rounded-full transition-all duration-300"
          [ngClass]="page === currentPage ? 'w-6 bg-secondary' : 'w-2.5 bg-gray-200'"
          [attr.aria-label]="'Go to slide ' + (page + 1)"
          role="tab"
          (click)="goToPage(page)"></button>
      }
    </div>

  </div>
</section>
