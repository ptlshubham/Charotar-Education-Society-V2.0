<section class="mx-auto max-w-[1600px] px-4 py-14 sm:px-6 lg:px-10">
  <div class="grid gap-8 lg:grid-cols-[280px_1fr] lg:items-center">

    <!-- Heading -->
    <div>
      <h2 class="text-[24px] font-bold text-primary sm:text-[30px]">From CES to the World</h2>
      <span class="mt-3 block h-1 w-16 rounded-full bg-accent" aria-hidden="true"></span>
      <p class="mt-4 text-[14px] leading-relaxed text-muted">
        Real stories. Real impact. Our students and alumni making a difference everywhere.
      </p>
      <a routerLink="/alumni"
        class="mt-5 inline-flex items-center gap-1.5 text-[14px] font-semibold text-accent no-underline hover:text-primary">
        View All Stories
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
      </a>
    </div>

    <!-- Testimonials -->
    <ul class="grid list-none gap-5 sm:grid-cols-3">
      @for (t of testimonials; track t.name) {
        <li class="flex gap-4 rounded-2xl border border-gray-100 bg-white p-5 shadow-[0_6px_22px_rgba(32,49,84,0.07)]">
          <div class="h-14 w-14 shrink-0 overflow-hidden rounded-full bg-primary-light">
            @if (t.photo) {
              <img [src]="t.photo" [alt]="t.name" class="h-full w-full object-cover" />
            } @else {
              <svg class="h-full w-full p-3.5 text-white/35" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.5-9 5.5V22h18v-2.5c0-3-4-5.5-9-5.5z" />
              </svg>
            }
          </div>
          <div>
            <blockquote class="text-[13px] leading-relaxed text-muted italic">&ldquo;{{ t.quote }}&rdquo;</blockquote>
            <p class="mt-3 text-[13.5px] font-bold text-primary">{{ t.name }}</p>
            <p class="text-[11.5px] text-muted">{{ t.role }}</p>
          </div>
        </li>
      }
    </ul>

  </div>
</section>
