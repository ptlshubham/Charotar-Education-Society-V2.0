<section class="relative overflow-hidden bg-primary" aria-labelledby="secretary-title">

  <!-- Faint arcs at the edges -->
  <svg class="pointer-events-none absolute inset-0 h-full w-full text-white/[0.07]" preserveAspectRatio="none"
    viewBox="0 0 1600 700" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
    <circle cx="-260" cy="330" r="420" />
    <circle cx="-260" cy="330" r="520" />
    <circle cx="1880" cy="420" r="380" />
  </svg>

  <div class="site-container relative grid items-center gap-10 py-12 lg:grid-cols-[1.15fr_1fr] lg:gap-14 lg:py-12">

    <!-- Message -->
    <div appReveal>
      <p class="text-[13px] font-bold tracking-[0.22em] text-secondary uppercase">Message from the Secretary</p>
      <h2 id="secretary-title" class="mt-3 text-[32px] leading-[1.08] font-bold tracking-tight text-white sm:text-[40px] lg:text-[44px] xl:text-[50px]">
        Guiding generations.<br />Inspiring futures.
      </h2>

      <figure class="mt-6">
        <blockquote class="relative max-w-[600px] pl-12 text-[16px] leading-[1.65] text-white/85 sm:pl-16 sm:text-[18px] xl:text-[20px]">
          <svg class="absolute top-0.5 left-0 h-8 w-8 text-secondary sm:h-10 sm:w-10" viewBox="0 0 24 24" fill="currentColor"
            aria-hidden="true">
            <path d="M10.3 5.2C6.6 6.9 4.2 10.1 4.2 14.2V19h6.4v-6.4H7.7c.2-2.3 1.6-4.1 3.9-5.2L10.3 5.2Zm9.4 0c-3.7 1.7-6.1 4.9-6.1 9V19H20v-6.4h-2.9c.2-2.3 1.6-4.1 3.9-5.2l-1.3-2.2Z" />
          </svg>
          <p>{{ secretary.quote }}</p>
        </blockquote>

        <span class="mt-6 block h-[3px] w-14 rounded-full bg-white/25" aria-hidden="true"></span>

        <figcaption class="mt-4">
          <p class="text-[18px] font-bold text-secondary sm:text-[20px]">{{ secretary.name }}</p>
          <p class="mt-1 text-[14px] text-white/60 sm:text-[15px]">{{ secretary.role }}</p>
        </figcaption>
      </figure>

      <a routerLink="/management" fragment="key-leaders"
        class="mt-6 inline-flex items-center gap-2 rounded-md bg-secondary px-6 py-3 text-[15px] font-bold text-primary no-underline shadow-lg shadow-black/20 transition-colors hover:bg-secondary-dark">
        Read Full Message
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 17 17 7M8 7h9v9" />
        </svg>
      </a>
    </div>

    <!-- Portrait in a gold corner frame -->
    <div class="relative mx-auto w-full max-w-[420px] lg:mr-4" [appReveal]="150">
      <span
        class="absolute -right-4 -bottom-4 h-[62%] w-[52%] rounded-br-lg border-r-[3px] border-b-[3px] border-secondary sm:-right-5 sm:-bottom-5"
        aria-hidden="true"></span>
      <img [src]="secretary.photo" [alt]="secretary.name + ', ' + secretary.role" loading="lazy" width="720" height="720"
        class="relative aspect-square w-full rounded-2xl object-cover object-top shadow-2xl shadow-black/30" />
    </div>

  </div>
</section>
