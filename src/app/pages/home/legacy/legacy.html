<!-- ─── Visionary tribute (parchment) ─── -->
<section class="bg-[#F3EBDA] bg-[url('/assets/images/home/parchment.jpg')] bg-cover bg-center">
  <div class="flex flex-col lg:flex-row lg:items-center">

    <!-- Portrait — shown in full (no crop), sized to its own aspect ratio -->
    <div class="w-full bg-[#241d12] lg:w-[40%]">
      <img [src]="portrait" alt="Pujya Shri Vitthalbhai J. Patel — Visionary of CES" loading="lazy"
        class="aspect-[508/583] w-full object-cover object-center" />
    </div>

    <!-- Message -->
    <div class="flex flex-col justify-center px-6 py-12 sm:px-10 sm:py-14 lg:w-[60%] lg:px-16 lg:py-16">
      <blockquote>
        <h2 class="max-w-2xl text-[24px] leading-snug font-semibold text-[#59513f] sm:text-[30px]">
          &ldquo;{{ quote }}&rdquo;
        </h2>
      </blockquote>

      @for (p of paragraphs; track p) {
      <p class="mt-5 max-w-2xl text-[15px] leading-relaxed text-[#59513f] sm:text-[16.5px]">{{ p }}</p>
      }

      <!-- Credits (new-site red play links) -->
      <div class="mt-7 flex flex-wrap items-center gap-x-8 gap-y-3">
        @for (credit of credits; track credit) {
        <a [href]="video" target="_blank" rel="noopener noreferrer"
          class="group inline-flex items-center gap-2.5 text-[13.5px] font-semibold text-[#59513f] no-underline transition-colors hover:text-accent">
          <span
            class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-accent text-white transition-transform group-hover:scale-105"
            aria-hidden="true">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z" />
            </svg>
          </span>
          {{ credit }}
        </a>
        }
      </div>

      <!-- New-site button -->
      <a routerLink="/glory/history-vj"
        class="mt-9 inline-flex w-fit items-center gap-2 rounded-md bg-accent px-6 py-3.5 text-[15px] font-semibold text-white no-underline transition-colors hover:brightness-110">
        Read More
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </a>
    </div>

  </div>
</section>

<!-- ─── Legacy timeline (own clean section) ─── -->
<section class="bg-[#F7F8FA] py-14 lg:py-16">
  <div class="mx-auto max-w-[1600px] px-4 sm:px-6 lg:px-10">
    <div class="text-center">
      <h2 class="text-[24px] font-bold text-primary sm:text-[30px]">A Legacy That Lives On</h2>
      <span class="mx-auto mt-3 block h-1 w-16 rounded-full bg-accent" aria-hidden="true"></span>
    </div>

    <ol class="mt-12 grid list-none grid-cols-2 gap-8 sm:grid-cols-5 sm:gap-2">
      @for (m of milestones; track m.year; let last = $last) {
      <li class="relative text-center">
        @if (!last) {
        <span class="absolute top-[6px] left-1/2 hidden h-0.5 w-full bg-secondary/40 sm:block"
          aria-hidden="true"></span>
        }
        <span class="relative z-10 mx-auto mb-4 block h-3.5 w-3.5 rounded-full ring-4 ring-[#F7F8FA]"
          [class]="last ? 'bg-accent' : 'bg-secondary'" aria-hidden="true"></span>
        <p class="text-[16px] font-bold text-primary">{{ m.year }}</p>
        <p class="mt-1.5 text-[12px] leading-snug text-muted">{{ m.label }}</p>
      </li>
      }
    </ol>
  </div>
</section>
