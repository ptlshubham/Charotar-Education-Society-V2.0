<section class=" py-16 lg:py-20">
  <div class="site-container">

    <div class="mb-14 text-center">
      <h2 class="text-[24px] font-bold text-primary sm:text-[30px]">Milestones That Made History</h2>
      <span class="mt-3 block mx-auto h-1 w-16 rounded-full bg-secondary" aria-hidden="true"></span>
    </div>

    <ul
      class="grid list-none grid-cols-2 gap-x-4 gap-y-8 sm:grid-cols-3 lg:grid-cols-4 sm:gap-x-6 lg:gap-y-10 max-w-5xl mx-auto">
      @for (a of achievements; track a.id) {
      <li class="group flex flex-col items-center text-center">

        <div class="relative">
          <!-- Image wrapper -->
          <div class="h-[120px] w-[120px] sm:h-[140px] sm:w-[140px] lg:h-[150px] lg:w-[150px]">

            <!-- Inner content (image or gradient) -->
            <div class="h-full w-full flex items-center justify-center"
              [class]="a.image ? '' : 'bg-gradient-to-tr from-primary/10 to-secondary/15 text-primary rounded-full'">
              @if (a.image) {
              <img [src]="a.image" [alt]="a.title" loading="lazy" class="h-full w-full object-contain" />
              } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"
                stroke-linejoin="round" class="w-10 h-10 sm:w-12 sm:h-12 lg:w-16 lg:h-16" aria-hidden="true">
                @switch (a.id) {
                @case (1) {
                <circle cx="12" cy="12" r="10" />
                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
                <line x1="12" y1="17" x2="12.01" y2="17" />
                }
                @case (2) {
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                <line x1="3" y1="9" x2="21" y2="9" />
                <line x1="3" y1="15" x2="21" y2="15" />
                <line x1="9" y1="3" x2="9" y2="21" />
                <line x1="15" y1="3" x2="15" y2="21" />
                }
                @case (3) {
                <path
                  d="m9.6 4.73 1.95-2.2c.4-.44 1.1-.55 1.63-.26.83.47 2.11 1.76 2.5 3.32l1.09 4.35c.16.63.48 1.2.93 1.66l1.24 1.25a3.9 3.9 0 0 1 1.12 2.8 3.55 3.55 0 0 1-3.55 3.55H9.6a8.9 8.9 0 0 1-6.1-2.4L2 15.3l3-3.66c.26-.3.6-.52.98-.62.4-.1.83-.1 1.23.03l1.8.63" />
                <path d="M12.9 8.2c-.1-.13-.23-.23-.38-.3M9.6 4.73l.79-1.92M7.8 9.5l-2.1-2.1" />
                }
                @case (4) {
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                }
                @case (5) {
                <path
                  d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z" />
                }
                @case (6) {
                <path d="M2 12s4.5-9 10-9 10 9 10 9-4.5 9-10 9-10-9-10-9z" />
                <path d="M12 3v18" />
                <path d="M2 12h20" />
                }
                @case (7) {
                <path d="M12 20h9" />
                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
                }
                @case (8) {
                <path d="M21 16H3" />
                <path d="M21 8H3" />
                <path d="M10 3L3 21" />
                <path d="M14 21L21 3" />
                }
                }
              </svg>
              }
            </div>
          </div>

        </div>

        <p
          class="mt-3 max-w-[180px] text-[15px] sm:text-[16px] lg:text-[18px] font-normal leading-[1.35] text-primary line-clamp-2">
          {{ a.title }}
        </p>
      </li>
      }
    </ul>

  </div>
</section>
