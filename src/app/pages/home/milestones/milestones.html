<section class="pt-10 pb-6 lg:pt-12 lg:pb-8" aria-labelledby="milestones-title">

  <!-- Heading -->
  <div class="site-container mb-4 flex flex-col items-center text-center">
    <span class="mb-2 text-[15px] font-medium tracking-[2px] text-secondary uppercase">Our World Records</span>
    <h2 id="milestones-title" class="text-[26px] leading-[1.1] font-bold tracking-tight text-primary lg:text-[36px] xl:text-[40px]">
      Milestones That Made History
    </h2>
    <p class="mt-3 text-[15px] text-[#5B6472] sm:text-[17px]">A century of learning. Extraordinary achievements together.</p>
    <span class="mt-4 block h-1 w-16 rounded-full bg-secondary" aria-hidden="true"></span>
  </div>

  <!-- Slider: the centre record large, three smaller ones each side, the outer ones peeking at the edges -->
  <div class="ms-band overflow-hidden py-3" role="region" aria-roledescription="carousel" tabindex="0"
    aria-label="Guinness World Records set by CES" (mouseenter)="hold(true)" (mouseleave)="hold(false)"
    (focusin)="hold(true)" (focusout)="hold(false)" (keydown.arrowleft)="prev()" (keydown.arrowright)="next()">
    <div #stage class="ms-stage" (pointerdown)="dragStart($event)" (pointerup)="dragEnd($event)" (pointercancel)="dragEnd($event)">
      @for (r of records; track r.title; let i = $index) {
      @let d = offset(i);
      <article class="ms-slide" [class.is-active]="d === 0" [class.is-hidden]="d < -3 || d > 3"
        [attr.data-dist]="d < 0 ? -d : d"
        [style.transform]="transform(i)" [style.z-index]="10 - (d < 0 ? -d : d)"
        role="group" aria-roledescription="slide" [attr.aria-label]="(i + 1) + ' of ' + records.length + ': ' + r.title"
        [attr.aria-hidden]="d !== 0" (click)="pick(i)">

        <!-- The record's circular, Guinness-badged photo - no box behind it -->
        <img [src]="r.image" [alt]="r.title" loading="lazy" draggable="false"
          class="ms-medal mx-auto block w-auto object-contain" />

        <!-- Text under the circle -->
        <div class="mt-3 px-2 text-center text-primary">
          <p class="ms-count text-[13px] font-bold text-secondary sm:text-[14px]" aria-hidden="true">
            {{ pad(i + 1) }} / {{ pad(records.length) }}
          </p>
          <h3 class="text-[17px] leading-tight font-bold sm:text-[22px]">{{ r.title }}</h3>
          <a routerLink="/celebration" fragment="guinness-records" [attr.tabindex]="d === 0 ? null : -1"
            class="mt-1 inline-flex items-center gap-1.5 text-[14px] underline decoration-1 underline-offset-4 hover:text-accent sm:text-[15px]">
            View certificate
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 17 17 7M8 7h9v9" />
            </svg>
          </a>
        </div>
      </article>
      }
    </div>
  </div>
</section>
