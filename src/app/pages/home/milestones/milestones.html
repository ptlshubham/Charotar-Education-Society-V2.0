<section class="bg-[#F7F8FA] py-14">
  <div class="mx-auto max-w-[1600px] px-4 sm:px-6 lg:px-10">

    <div class="mb-10 flex flex-wrap items-end justify-between gap-4">
      <div>
        <h2 class="text-[24px] font-bold text-primary sm:text-[30px]">Milestones That Made History</h2>
        <span class="mt-3 block h-1 w-16 rounded-full bg-accent" aria-hidden="true"></span>
      </div>
      <a routerLink="/celebration"
        class="inline-flex shrink-0 items-center gap-1.5 text-[14px] font-semibold text-accent no-underline hover:text-primary">
        View All Achievements
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
      </a>
    </div>

    <ul class="grid list-none grid-cols-2 gap-8 sm:grid-cols-4">
      @for (record of records; track record.title) {
        <li class="flex flex-col items-center text-center">
          <div class="relative">
            <div class="h-28 w-28 overflow-hidden rounded-full bg-primary-light shadow-md ring-4 ring-white outline outline-2 outline-secondary/40">
              <img [src]="record.image" [alt]="record.title" loading="lazy" class="h-full w-full object-cover" />
            </div>
            <span class="absolute -bottom-1 left-1/2 flex h-8 w-8 -translate-x-1/2 items-center justify-center rounded-full bg-secondary text-primary shadow" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="6" /><path d="m8.2 13-1.2 8 5-3 5 3-1.2-8" />
              </svg>
            </span>
          </div>
          <p class="mt-6 max-w-[160px] text-[14px] leading-snug font-semibold text-primary">{{ record.title }}</p>
        </li>
      }
    </ul>

  </div>
</section>
