<section class="site-container py-14">

  <div class="text-center">
    <h2 class="text-[24px] font-bold text-primary sm:text-[30px]">More Than Classrooms</h2>
    <span class="mx-auto mt-3 block h-1 w-16 rounded-full bg-secondary" aria-hidden="true"></span>
  </div>

  <ul class="mt-10 grid list-none grid-cols-2 gap-5 lg:grid-cols-4">
    @for (card of cards; track card.title) {
      <li>
        <a [routerLink]="card.link"
          class="group relative block aspect-[5/4] overflow-hidden rounded-2xl no-underline shadow-[0_8px_26px_rgba(32,49,84,0.10)]">
          <img [src]="card.image" [alt]="card.title" loading="lazy"
            class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105" />
          <span class="absolute inset-0 bg-gradient-to-t from-primary/90 via-primary/25 to-transparent" aria-hidden="true"></span>
          <span class="absolute inset-x-4 bottom-4 text-[16px] font-bold text-white">{{ card.title }}</span>
        </a>
      </li>
    }
  </ul>

  <div class="mt-10 flex justify-center">
    <a routerLink="/social-activity"
      class="inline-flex shrink-0 items-center gap-2 rounded-lg bg-primary px-6 py-3 text-[15px] font-semibold text-white no-underline transition-colors hover:bg-primary/90">
      View All Activities
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
    </a>
  </div>

</section>
