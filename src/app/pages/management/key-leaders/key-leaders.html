<section class="site-container py-12">
  <div class="grid gap-6 lg:grid-cols-2">
    @for (leader of leaders; track leader.name; let i = $index) {
      <article [appReveal]="i * 140"
        class="flex flex-col gap-5 rounded-2xl border border-gray-200 bg-white p-5 sm:flex-row sm:gap-7 sm:p-6">

        <img [src]="leader.photo" [alt]="leader.name" loading="lazy"
          class="h-[320px] w-full shrink-0 rounded-xl bg-primary-light object-cover object-top sm:h-[340px] sm:w-[260px] lg:h-[360px] lg:w-[280px]" />

        <div class="min-w-0">
          <div class="flex items-start justify-between gap-3">
            <h2 class="text-[20px] leading-tight font-bold text-primary sm:text-[22px]">{{ leader.name }}</h2>
            <svg class="mt-0.5 shrink-0 text-secondary" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 15a6 6 0 1 0 0-12 6 6 0 0 0 0 12z" /><path d="m8.2 13.9-1.4 7.1 5.2-2.6 5.2 2.6-1.4-7.1" />
            </svg>
          </div>

          <p class="mt-2 text-[14px] font-semibold text-secondary">{{ leader.role }}</p>
          <p class="text-[13px] text-muted">{{ leader.subRole }}</p>

          <p class="mt-4 text-[13px] leading-relaxed text-muted">{{ leader.quote }}</p>

          <button type="button"
            class="mt-5 inline-flex items-center gap-2 rounded-md border border-gray-300 px-4 py-2 text-[13px] font-semibold text-primary transition-colors hover:border-primary hover:bg-primary hover:text-white">
            Read More
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
          </button>
        </div>

      </article>
    }
  </div>
</section>
