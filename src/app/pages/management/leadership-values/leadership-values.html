<section class="site-container py-12">
  <div class="grid gap-6 rounded-2xl bg-[#F7F9FC] p-6 lg:grid-cols-[1fr_2.2fr] lg:items-center lg:gap-8 lg:p-8">

    <div>
      <h2 class="text-[20px] font-bold text-primary sm:text-[24px]">Leadership That Inspires</h2>
      <span class="mt-3 block h-1 w-14 rounded-full bg-secondary" aria-hidden="true"></span>
      <p class="mt-4 text-[13px] leading-relaxed text-muted">
        Our leaders believe in integrity, transparency and collective growth. Together, we shape institutions
        that create opportunities and empower generations.
      </p>
    </div>

    <ul class="grid list-none grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-5">
      @for (value of values; track value.title; let i = $index) {
        <li [appReveal]="i * 90"
          class="flex flex-col items-center rounded-xl border border-gray-200 bg-white px-3 py-5 text-center">
          <svg class="text-secondary" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            @for (d of value.path; track d) { <path [attr.d]="d" /> }
          </svg>
          <h3 class="mt-3 text-[13px] leading-snug font-semibold text-primary">{{ value.title }}</h3>
        </li>
      }
    </ul>

  </div>
</section>
