<section class="mx-auto max-w-[1600px] px-4 py-6 sm:px-6 lg:px-10">

  <div class="text-center">
    <h2 class="text-[24px] leading-tight font-bold text-primary sm:text-[30px]">
      Management Members of<br class="hidden sm:block" />
      Charotar Education Society
    </h2>
    <span class="mx-auto mt-3 block h-1 w-16 rounded-full bg-secondary" aria-hidden="true"></span>
    <p class="mx-auto mt-4 max-w-[560px] text-[14px] leading-relaxed text-muted">
      A dedicated team of experienced leaders and professionals working together to uphold the values, vision
      and mission of CES.
    </p>
  </div>

  <ul class="mt-9 grid list-none grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-5">
    @for (member of members; track member.name; let i = $index) {
      <!-- The designation reveals on hover (pointer) and on click/tap (touch).
           Its full text is in aria-label, so it is always available to screen
           readers regardless of the visual reveal. -->
      <li [appReveal]="(i % 5) * 90" (click)="toggle(member.name)"
        (keydown.enter)="toggle(member.name)" (keydown.space)="$event.preventDefault(); toggle(member.name)"
        role="button" tabindex="0" [attr.aria-expanded]="isExpanded(member.name)"
        [attr.aria-label]="member.name + ' — ' + member.role"
        class="group cursor-pointer rounded-xl border border-gray-200 bg-white p-3 text-center transition-all duration-200 hover:border-secondary hover:shadow-md focus-visible:border-secondary focus-visible:shadow-md focus-visible:outline-none">
        <img [src]="member.photo" [alt]="member.name" loading="lazy"
          class="aspect-square w-full rounded-lg bg-primary-light object-cover" />

        <h3 class="mt-3 text-[15px] font-semibold text-primary">{{ member.name }}</h3>
        <span class="mx-auto mt-1.5 block h-0.5 w-8 rounded-full bg-secondary transition-all duration-200 group-hover:w-12" aria-hidden="true"></span>

        <div class="grid transition-[grid-template-rows,opacity] duration-300 ease-out"
          [ngClass]="isExpanded(member.name)
            ? 'grid-rows-[1fr] opacity-100'
            : 'grid-rows-[0fr] opacity-0 group-hover:grid-rows-[1fr] group-hover:opacity-100 group-focus-visible:grid-rows-[1fr] group-focus-visible:opacity-100'">
          <p class="overflow-hidden pt-2 text-[13px] leading-relaxed text-muted">{{ member.role }}</p>
        </div>
      </li>
    }
  </ul>

  <app-former-bearers />

</section>
