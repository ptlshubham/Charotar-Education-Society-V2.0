<section class="site-container pb-8">
  <div class="rounded-xl border border-gray-200 bg-white p-6 lg:p-8">

    <h2 class="text-center text-[22px] font-bold text-primary sm:text-[26px]">Our Impact</h2>
    <span class="mx-auto mt-3 block h-1 w-14 rounded-full bg-secondary" aria-hidden="true"></span>

    <ul class="mt-7 grid list-none grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-6">
      @for (stat of stats; track stat.label) {
        <li class="rounded-lg border border-gray-200 px-3 py-5 text-center transition-colors hover:border-primary">
          <svg class="mx-auto text-primary" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            @for (d of stat.path; track d) { <path [attr.d]="d" /> }
          </svg>
          <p class="mt-3 text-[20px] leading-tight font-bold text-primary">{{ stat.value }}</p>
          <p class="mt-1 text-[11px] leading-snug text-muted">{{ stat.label }}</p>
        </li>
      }
    </ul>

  </div>
</section>
