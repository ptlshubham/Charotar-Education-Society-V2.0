<section class="site-container py-8">

  <!-- Focus-area filters -->
  <div role="tablist" aria-label="Project focus area"
    class="flex justify-start gap-3 overflow-x-auto py-6 pb-2 sm:justify-center lg:flex-wrap lg:overflow-visible">
    @for (filter of filters; track filter.id) {
      <button type="button" role="tab" [attr.aria-selected]="active() === filter.id" (click)="select(filter.id)"
        class="flex shrink-0 items-center gap-2 rounded-lg px-4 py-2.5 text-[13px] font-semibold transition-colors"
        [class]="active() === filter.id
          ? 'bg-primary text-white shadow-md'
          : 'text-primary hover:bg-primary/10'">
        <span class="material-symbols-outlined !text-[23px] [font-variation-settings:'wght'_300]" aria-hidden="true">{{ filter.icon }}</span>
        {{ filter.label }}
      </button>
    }
  </div>

  <!-- Cards -->
  <ul class="animate-dropdown mt-6 flex snap-x snap-mandatory list-none gap-4 overflow-x-auto pb-3 lg:grid lg:grid-cols-4 lg:gap-5 lg:overflow-visible lg:pb-0">
    @for (project of visible(); track project.title) {
      <li class="flex min-w-[calc(50%-0.5rem)] snap-start flex-col overflow-hidden rounded-xl border border-gray-200 bg-white lg:min-w-0">

        <div class="relative">
          <img [src]="project.image" [alt]="project.title" loading="lazy"
            class="aspect-[3/2] w-full bg-primary-light object-cover" />
        </div>

        <div class="flex flex-1 flex-col p-4">
          <h3 class="text-[15px] font-bold text-primary">{{ project.title }}</h3>
          <p class="mt-2 flex-1 text-[12.5px] leading-relaxed text-muted">{{ project.desc }}</p>

          <a href="#" class="mt-4 inline-flex items-center gap-1.5 text-[13px] font-semibold text-primary no-underline hover:text-accent">
            Read More
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
          </a>
        </div>

      </li>
    } @empty {
      <li class="min-w-full rounded-lg border border-dashed border-gray-300 bg-[#F7F9FC] px-4 py-10 text-center text-[13px] text-muted lg:col-span-full lg:min-w-0">
        No projects in this focus area yet.
      </li>
    }
  </ul>

</section>
