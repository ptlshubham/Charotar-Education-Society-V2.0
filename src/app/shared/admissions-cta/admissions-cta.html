<section class="site-container pb-12 sm:pb-16" aria-labelledby="admissions-title">
  <div class="grid overflow-hidden rounded-[24px] bg-primary lg:grid-cols-[minmax(0,1fr)_minmax(0,0.5fr)]">

    <!-- Message -->
    <div class="px-6 py-8 sm:px-10 sm:py-10 lg:px-12 xl:px-16">
      <p class="inline-flex items-center gap-2.5 text-[12px] font-semibold tracking-[2px] text-secondary uppercase sm:text-[14px]">
        <span class="relative flex h-2 w-2" aria-hidden="true">
          <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-secondary opacity-70 motion-reduce:hidden"></span>
          <span class="relative inline-flex h-2 w-2 rounded-full bg-secondary"></span>
        </span>
        Admissions {{ session }}
      </p>

      <h2 id="admissions-title" class="mt-2.5 text-[28px] leading-[1.1] font-semibold text-white sm:text-[34px] xl:text-[40px]">
        Your next chapter starts here.
      </h2>
      <p class="mt-2 text-[20px] leading-tight font-semibold text-white sm:text-[23px] xl:text-[26px]">
        Admissions Open <span class="text-secondary">{{ session }}</span>
      </p>

      <!-- <p class="mt-3 max-w-[600px] text-[15px] leading-relaxed text-white/75 sm:text-[16px]">
        Be a part of a legacy that shapes the future - from pre-primary to doctorate, across Charotar.
      </p> -->

      <!-- <ul class="mt-4 flex list-none flex-wrap gap-x-8 gap-y-2.5 p-0">
        @for (fact of facts; track fact) {
        <li class="inline-flex items-center gap-2.5 text-[15px] text-white/90 sm:text-[16px]">
          <svg class="shrink-0 text-secondary" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 6 9 17l-5-5" />
          </svg>
          {{ fact }}
        </li>
        }
      </ul> -->

      <div class="mt-6 flex flex-wrap items-center gap-x-8 gap-y-4">
        <a routerLink="/contact"
          class="inline-flex items-center gap-2 rounded-lg bg-secondary px-7 py-3 text-[16px] font-semibold text-primary no-underline shadow-lg shadow-black/20 transition-colors hover:bg-secondary-dark focus:outline-none focus-visible:ring-2 focus-visible:ring-white">
          Enquire Now
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
        </a>
        <a [href]="phoneHref"
          class="inline-flex items-center gap-2.5 text-[16px] font-semibold text-white no-underline transition-colors hover:text-secondary focus:outline-none focus-visible:text-secondary">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z" />
          </svg>
          Call {{ phone }}
        </a>
      </div>
    </div>

    <!-- Heritage panel: the years since 1916 over a line drawing of D.N. High School, Anand.
         The drawing is pinned to the panel's foot (so the message side alone sets the height),
         shown at 150% of the panel width and cropped at the sides with its clock tower (the
         drawing's centre) about 70% across - clear of the text; multiply blends its white paper
         into the cream. -->
    <div class="relative min-h-[320px] overflow-hidden border-t-4 border-secondary bg-[#F7F4EC] lg:min-h-0 lg:border-t-0 lg:border-l-4">
      <div class="relative z-10 px-8 pt-7 sm:px-10 lg:pt-9">
        <p class="mt-1.0 text-[35px] leading-none font-bold text-primary sm:text-[39px]">{{ years }}+</p>
        <span class="block h-1 w-12 rounded-full bg-secondary" aria-hidden="true"></span>
        <p class="mt-1.0 text-[16px] font-medium text-primary sm:text-[17px]">Years of Excellence</p>
        <p class="mt-1.0 text-[12px] font-semibold tracking-[3px] text-secondary uppercase">Since 1916</p>
      </div>
      <img src="/assets/images/header/campus.webp" alt="Line drawing of D.N. High School, Anand" loading="lazy"
        width="2172" height="724" class="absolute bottom-0 -left-[5%] block w-[150%] max-w-none mix-blend-multiply" />
    </div>

  </div>
</section>
