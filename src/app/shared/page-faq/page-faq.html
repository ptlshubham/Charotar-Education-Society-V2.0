@if (faqs().length) {
  <section class="site-container py-10" aria-labelledby="page-faq-title">
    <h2 id="page-faq-title" class="text-[22px] font-bold text-primary">Frequently Asked Questions</h2>
    <span class="mt-2 block h-1 w-12 rounded-full bg-secondary" aria-hidden="true"></span>

    <div class="mt-5 space-y-2">
      @for (f of faqs(); track $index) {
        <details class="group rounded-lg border border-gray-200 bg-white">
          <summary
            class="flex cursor-pointer list-none items-center justify-between gap-3 px-4 py-3 text-left text-[14px] font-semibold text-primary [&::-webkit-details-marker]:hidden">
            <span>{{ f.q }}</span>
            <svg class="shrink-0 text-muted transition-transform duration-200 group-open:rotate-45"
              width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 5v14M5 12h14" />
            </svg>
          </summary>
          <p class="whitespace-pre-line border-t border-gray-100 px-4 py-3 text-[13px] leading-relaxed text-muted">{{ f.a }}</p>
        </details>
      }
    </div>
  </section>
}
