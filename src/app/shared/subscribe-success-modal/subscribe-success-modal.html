@if (newsletter.showSuccess()) {
<div class="fixed inset-0 z-[100] flex items-center justify-center p-4">
  <!-- Backdrop -->
  <div class="absolute inset-0 bg-black/40" (click)="newsletter.close()"></div>

  <!-- Card -->
  <div
    class="relative z-10 w-full max-w-[480px] rounded-[20px] bg-white p-8 shadow-[0_30px_80px_-20px_rgba(11,40,39,0.35)]">
    <button type="button" aria-label="Close" (click)="newsletter.close()"
      class="absolute right-5 top-5 text-muted hover:text-primary transition-colors">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>

    <!-- Illustration -->
    <div class="flex justify-center">
      <svg viewBox="0 0 220 170" class="w-[220px] h-auto" fill="none" xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true">
        <circle cx="110" cy="80" r="62" fill="#E9F5F4" />
        <!-- envelope back flap -->
        <path d="M74 74 L110 48 L146 74 L110 100 Z" fill="#2C8F88" />
        <!-- envelope body -->
        <path d="M74 74 L110 100 L146 74 V112 a5 5 0 0 1-5 5 H79 a5 5 0 0 1-5-5 Z" fill="#FFFFFF" stroke="#D6E7E4"
          stroke-width="2" />
        <path d="M74 112 L98 92" stroke="#EAF2F1" stroke-width="2" />
        <path d="M146 112 L122 92" stroke="#EAF2F1" stroke-width="2" />
        <!-- check badge -->
        <circle cx="110" cy="70" r="16" fill="#2C8F88" />
        <path d="M103 70 l5 5 9-10" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        <!-- confetti -->
        <circle cx="52" cy="52" r="3" fill="#F5B841" />
        <circle cx="60" cy="98" r="3" fill="#203154" />
        <circle cx="168" cy="60" r="3" fill="#5FA85F" />
        <circle cx="160" cy="104" r="3.5" fill="#8AA0FF" />
        <circle cx="48" cy="82" r="2.5" fill="#F17C9F" />
        <path d="M42 66 q6 -6 12 0" stroke="#8AA0FF" stroke-width="2" fill="none" stroke-linecap="round" />
        <path d="M168 80 q6 6 12 0" stroke="#8AA0FF" stroke-width="2" fill="none" stroke-linecap="round" />
      </svg>
    </div>

    <h2 class="mt-2 text-center text-primary text-[34px] font-bold leading-tight">Thank you!</h2>
    <p class="mt-2 text-center text-[15px] leading-[22px] text-muted">
      You've successfully subscribed to<br />ZarklyX updates.
    </p>

    <!-- All set info box -->
    <div class="mt-6 flex items-start gap-4 rounded-[14px] bg-primary/[0.06] p-4">
      <span class="flex items-center justify-center w-12 h-12 rounded-full bg-primary/10 text-primary shrink-0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2" />
          <path d="m3 7 9 6 9-6" />
        </svg>
      </span>
      <div>
        <p class="text-primary text-[15px] font-semibold">You're all set!</p>
        <p class="mt-1 text-[13px] leading-[19px] text-muted">
          We'll keep you updated with the latest tips, insights, and news.
        </p>
      </div>
    </div>

    <!-- Divider -->
    <div class="mt-6 flex items-center gap-3">
      <span class="h-px flex-1 bg-primary/10"></span>
      <span class="text-[13px] text-muted whitespace-nowrap">Explore more while you're here</span>
      <span class="h-px flex-1 bg-primary/10"></span>
    </div>

    <!-- Actions -->
    <div class="mt-5 grid grid-cols-1 sm:grid-cols-2 gap-3">
      <a routerLink="/blog" (click)="newsletter.close()"
        class="inline-flex items-center justify-center gap-2 h-12 rounded-[10px] border border-primary/15 text-primary text-[14px] font-semibold hover:border-primary hover:text-primary transition-colors">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z" />
          <path d="M14 2v6h6M8 13h8M8 17h6" />
        </svg>
        View Resources
      </a>
      <a routerLink="/" (click)="newsletter.close()"
        class="inline-flex items-center justify-center gap-2 h-12 rounded-[10px] bg-primary text-white text-[14px] font-semibold hover:bg-primary transition-colors">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <path d="M9 22V12h6v10" />
        </svg>
        Go to Homepage
      </a>
    </div>
  </div>
</div>
}
