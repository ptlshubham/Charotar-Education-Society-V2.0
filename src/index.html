  <!-- ─── Legacy hash-URL redirect ───
       The old site ran Angular with `useHash: true`, so every inbound link,
       bookmark and search result looks like https://cesociety.in/#/about.
       This CANNOT be done in .htaccess: the browser never sends the fragment to
       the server, so Apache sees a bare request for "/" and has nothing to match
       on. It has to run here, client-side, before the app boots.

       Runs first and uses location.replace() so the visitor lands on the real
       prerendered page (correct HTML + meta) and the old URL leaves no history
       entry to bounce back to. -->
  <script>
    (function () {
      var hash = window.location.hash;
      if (hash.indexOf('#/') !== 0) return;

      var target = hash.slice(1);
      var query = '';
      var q = target.indexOf('?');
      if (q !== -1) { query = target.slice(q); target = target.slice(0, q); }
      target = target.replace(/\/+$/, '') || '/';

      // Old paths whose page moved, merged, or was renamed. Anything not listed
      // keeps the same path on the new site.
      var ALIASES = {
        '/home': '/',
        '/bearers': '/management',        // now a "Former Office Bearers" section there
        '/photo': '/glory/gallery',
        '/glory/old': '/glory/gallery',
        '/home/more-details': '/about',
        '/home/history-vj': '/glory/history-vj'
      };
      var PREFIXES = [
        ['/navratri-details/', '/navratri/'],
        ['/home/blog-details/', '/blog/']
      ];

      if (ALIASES[target]) {
        target = ALIASES[target];
      } else if (target.indexOf('/more/search/') === 0) {
        target = '/';                     // no site-wide search page on the new site
      } else {
        for (var i = 0; i < PREFIXES.length; i++) {
          if (target.indexOf(PREFIXES[i][0]) === 0) {
            target = PREFIXES[i][1] + target.slice(PREFIXES[i][0].length);
            break;
          }
        }
      }

      window.location.replace(target + query);
    })();
  </script>

  <script>
    // Update favicons immediately based on browser dark mode
    (function () {
      var isBrowserDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var favicon16 = document.getElementById('favicon-16');
      var favicon32 = document.getElementById('favicon-32');
      var faviconIco = document.getElementById('favicon-ico');

      function setDark() {
        if (favicon16) favicon16.href = 'favicon-16x16-white.png';
        if (favicon32) favicon32.href = 'favicon-32x32-white.png';
        if (faviconIco) faviconIco.href = 'favicon-white.ico';
      }

      function setLight() {
        if (favicon16) favicon16.href = 'favicon-16x16.png';
        if (favicon32) favicon32.href = 'favicon-32x32.png';
        if (faviconIco) faviconIco.href = 'favicon.ico';
      }

      if (isBrowserDark) setDark();

      // Listen for browser dark mode changes
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        if (e.matches) setDark();
        else setLight();
      });
    })();
  </script>
