  <!-- ─── Legacy hash-URL redirect ───
       The old site ran Angular with `useHash: true`, so every inbound link,
       bookmark and search result looks like https://cesociety.in/#/about.
       This CANNOT be done in .htaccess: the browser never sends the fragment to
       the server, so Apache sees a bare request for "/" and has nothing to match
       on. It has to run here, client-side, before the app boots.

       Runs first and uses location.replace() so the visitor lands on the real
       prerendered page (correct HTML + meta) and the old URL leaves no history
       entry to bounce back to. -->
  <script>
    (function () {
      var hash = window.location.hash;
      if (hash.indexOf('#/') !== 0) return;

      var target = hash.slice(1);
      var query = '';
      var q = target.indexOf('?');
      if (q !== -1) { query = target.slice(q); target = target.slice(0, q); }
      target = target.replace(/\/+$/, '') || '/';

      // Old paths whose page moved, merged, or was renamed. Anything not listed
      // keeps the same path on the new site.
      var ALIASES = {
        '/home': '/',
        '/bearers': '/management',        // now a "Former Office Bearers" section there
        '/photo': '/glory/gallery',
        '/glory/old': '/glory/gallery',
        '/home/more-details': '/about',
        '/home/history-vj': '/glory/history-vj'
      };
      var PREFIXES = [
        ['/navratri-details/', '/navratri/'],
        ['/home/blog-details/', '/blog/']
      ];

      if (ALIASES[target]) {
        target = ALIASES[target];
      } else if (target.indexOf('/more/search/') === 0) {
        target = '/';                     // no site-wide search page on the new site
      } else {
        for (var i = 0; i < PREFIXES.length; i++) {
          if (target.indexOf(PREFIXES[i][0]) === 0) {
            target = PREFIXES[i][1] + target.slice(PREFIXES[i][0].length);
            break;
          }
        }
      }

      window.location.replace(target + query);
    })();
  </script>

  <script>
    // Update favicons immediately based on browser dark mode
    (function () {
      var isBrowserDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var favicon16 = document.getElementById('favicon-16');
      var favicon32 = document.getElementById('favicon-32');
      var faviconIco = document.getElementById('favicon-ico');

      function setDark() {
        if (favicon16) favicon16.href = 'favicon-16x16-white.png';
        if (favicon32) favicon32.href = 'favicon-32x32-white.png';
        if (faviconIco) faviconIco.href = 'favicon-white.ico';
      }

      function setLight() {
        if (favicon16) favicon16.href = 'favicon-16x16.png';
        if (favicon32) favicon32.href = 'favicon-32x32.png';
        if (faviconIco) faviconIco.href = 'favicon.ico';
      }

      if (isBrowserDark) setDark();

      // Listen for browser dark mode changes
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        if (e.matches) setDark();
        else setLight();
      });
    })();
  </script>

  <!-- ─── Page loader ───
       Dyuno walks on the spot while the page loads (markup + script at the top of <body>).
       Inline so it paints before the app's CSS and JS arrive. The walk frames are the
       launcher's (layouts/ai-assistant): 110ms each, and the ground slides at his walking
       pace (62.5px/s at 72px, so ~111px/s at 128px) so his feet don't skate. -->
  <style>
    #ces-loader {
      position: fixed;
      inset: 0;
      z-index: 2147483000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #fff;
      /* Fail-safe: lifts itself even if the script never runs. */
      animation: ces-loader-failsafe 0.35s ease 12s forwards;
    }
    #ces-loader.is-done {
      pointer-events: none;
      animation: ces-loader-out 0.35s ease forwards;
    }
    @keyframes ces-loader-failsafe { to { opacity: 0; visibility: hidden; pointer-events: none; } }
    @keyframes ces-loader-out { to { opacity: 0; visibility: hidden; } }

    #ces-loader .ces-loader__dyuno {
      position: relative;
      width: 128px;
      height: 128px;
    }
    /* Every frame is stacked; each shows for its 110ms slot of the 880ms cycle. */
    #ces-loader .ces-loader__dyuno img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      animation: ces-loader-frame 880ms step-end infinite;
    }
    #ces-loader .ces-loader__dyuno img:nth-child(2) { animation-delay: 110ms; }
    #ces-loader .ces-loader__dyuno img:nth-child(3) { animation-delay: 220ms; }
    #ces-loader .ces-loader__dyuno img:nth-child(4) { animation-delay: 330ms; }
    #ces-loader .ces-loader__dyuno img:nth-child(5) { animation-delay: 440ms; }
    #ces-loader .ces-loader__dyuno img:nth-child(6) { animation-delay: 550ms; }
    #ces-loader .ces-loader__dyuno img:nth-child(7) { animation-delay: 660ms; }
    #ces-loader .ces-loader__dyuno img:nth-child(8) { animation-delay: 770ms; }
    @keyframes ces-loader-frame { 0% { opacity: 1; } 12.5% { opacity: 0; } }

    /* The ground under his feet, sliding left as he walks right. 3 dashes of 37px = 111px a second. */
    #ces-loader .ces-loader__ground {
      width: 180px;
      height: 3px;
      margin-top: -24px;
      border-radius: 3px;
      background: repeating-linear-gradient(90deg, #c5cee0 0 19px, transparent 19px 37px);
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent);
      mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent);
      animation: ces-loader-ground 1s linear infinite;
    }
    @keyframes ces-loader-ground { to { background-position-x: -111px; } }

    #ces-loader .ces-loader__text {
      font: 600 13px/1 'DM Sans', system-ui, sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #203154;
    }

    @media (prefers-reduced-motion: reduce) {
      #ces-loader .ces-loader__dyuno img,
      #ces-loader .ces-loader__ground { animation: none; }
      #ces-loader .ces-loader__dyuno img:first-child { opacity: 1; }
    }
  </style>

  <!-- Page loader (styles in <head>). Lifts once the page's files have loaded AND the app has
       its first data (App fires `ces:app-ready`), never before one walk cycle so it doesn't
       just flash, never later than 10s. Fires `ces:loader-done` as it fades - the launcher
       Dyuno waits for that before walking in. Only on a full page load; in-app navigation
       never shows it. -->
  <div id="ces-loader" role="status" aria-live="polite">
    <!-- fetchpriority: otherwise the browser queues the frames behind the JS bundles, and on a
         slow connection the ground walks without him. -->
    <div class="ces-loader__dyuno" aria-hidden="true">
      <img src="/assets/icons/dyuno/dyuno-walk-1.webp" alt="" width="128" height="128" fetchpriority="high">
      <img src="/assets/icons/dyuno/dyuno-walk-2.webp" alt="" width="128" height="128" fetchpriority="high">
      <img src="/assets/icons/dyuno/dyuno-walk-3.webp" alt="" width="128" height="128" fetchpriority="high">
      <img src="/assets/icons/dyuno/dyuno-walk-4.webp" alt="" width="128" height="128" fetchpriority="high">
      <img src="/assets/icons/dyuno/dyuno-walk-5.webp" alt="" width="128" height="128" fetchpriority="high">
      <img src="/assets/icons/dyuno/dyuno-walk-6.webp" alt="" width="128" height="128" fetchpriority="high">
      <img src="/assets/icons/dyuno/dyuno-walk-7.webp" alt="" width="128" height="128" fetchpriority="high">
      <img src="/assets/icons/dyuno/dyuno-walk-8.webp" alt="" width="128" height="128" fetchpriority="high">
    </div>
    <div class="ces-loader__ground" aria-hidden="true"></div>
    <p class="ces-loader__text">Loading</p>
  </div>
  <script>
    (function () {
      var loader = document.getElementById('ces-loader');
      if (!loader) return;

      // Both counted from the start of the page load (performance.now() is 0 there).
      var MIN_MS = 880;     // one walk cycle
      var MAX_MS = 10000;   // a slow image or API never keeps the page covered
      var pageLoaded = document.readyState === 'complete';
      var appReady = false;
      var lifted = false;

      function lift() {
        if (lifted) return;
        lifted = true;
        setTimeout(function () {
          loader.classList.add('is-done');
          window.dispatchEvent(new Event('ces:loader-done'));
          setTimeout(function () { loader.remove(); }, 400);
        }, Math.max(0, MIN_MS - performance.now()));
      }

      function check() { if (pageLoaded && appReady) lift(); }

      window.addEventListener('load', function () { pageLoaded = true; check(); });
      window.addEventListener('ces:app-ready', function () { appReady = true; check(); });
      setTimeout(lift, Math.max(0, MAX_MS - performance.now()));
    })();
  </script>

  <app-root></app-root>
</body>
