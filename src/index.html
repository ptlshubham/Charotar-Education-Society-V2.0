  <!-- ─── Legacy hash-URL redirect ───
       The old site ran Angular with `useHash: true`, so every inbound link,
       bookmark and search result looks like https://cesociety.in/#/about.
       This CANNOT be done in .htaccess: the browser never sends the fragment to
       the server, so Apache sees a bare request for "/" and has nothing to match
       on. It has to run here, client-side, before the app boots.

       Runs first and uses location.replace() so the visitor lands on the real
       prerendered page (correct HTML + meta) and the old URL leaves no history
       entry to bounce back to. -->
  <script>
    (function () {
      var hash = window.location.hash;
      if (hash.indexOf('#/') !== 0) return;

      var target = hash.slice(1);
      var query = '';
      var q = target.indexOf('?');
      if (q !== -1) { query = target.slice(q); target = target.slice(0, q); }
      target = target.replace(/\/+$/, '') || '/';

      // Old paths whose page moved, merged, or was renamed. Anything not listed
      // keeps the same path on the new site.
      var ALIASES = {
        '/home': '/',
        '/bearers': '/management',        // now a "Former Office Bearers" section there
        '/photo': '/glory/gallery',
        '/glory/old': '/glory/gallery',
        '/home/more-details': '/about',
        '/home/history-vj': '/glory/history-vj'
      };
      var PREFIXES = [
        ['/navratri-details/', '/navratri/'],
        ['/home/blog-details/', '/blog/']
      ];

      if (ALIASES[target]) {
        target = ALIASES[target];
      } else if (target.indexOf('/more/search/') === 0) {
        target = '/';                     // no site-wide search page on the new site
      } else {
        for (var i = 0; i < PREFIXES.length; i++) {
          if (target.indexOf(PREFIXES[i][0]) === 0) {
            target = PREFIXES[i][1] + target.slice(PREFIXES[i][0].length);
            break;
          }
        }
      }

      window.location.replace(target + query);
    })();
  </script>

  <script>
    // Update favicons immediately based on browser dark mode
    (function () {
      var isBrowserDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var favicon16 = document.getElementById('favicon-16');
      var favicon32 = document.getElementById('favicon-32');
      var faviconIco = document.getElementById('favicon-ico');

      function setDark() {
        if (favicon16) favicon16.href = 'favicon-16x16-white.png';
        if (favicon32) favicon32.href = 'favicon-32x32-white.png';
        if (faviconIco) faviconIco.href = 'favicon-white.ico';
      }

      function setLight() {
        if (favicon16) favicon16.href = 'favicon-16x16.png';
        if (favicon32) favicon32.href = 'favicon-32x32.png';
        if (faviconIco) faviconIco.href = 'favicon.ico';
      }

      if (isBrowserDark) setDark();

      // Listen for browser dark mode changes
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        if (e.matches) setDark();
        else setLight();
      });
    })();
  </script>

  <!-- ─── Page loader ───
       Dyuno drops in on a thread and swings while the page loads (markup + controller in <body>).
       Inline so it paints before the app's CSS and JS arrive.

       One pose (assets/images/loader/dyuno-hang.webp, made by scripts/dyuno-loader-assets.mjs) is
       moved and rotated; the keyframes it came from are separate renders that jump if played in
       turn. The thread is drawn here, behind him: the sprite has its rope cut out, so the thread
       shows through the gap between his arms. Thread and Dyuno sit in one .ces-loader__swing,
       rotated about the top of the screen, so the thread's top never moves and its other end never
       leaves his hands. He slides down the hanging thread, stretches it a little (the bounce),
       eases into the swing at its far left and loops from there, so the loop has no seam. He
       blinks at the swing's far end (the blink frame's face, laid over his).

       Sizes are fractions of --m, his height from hands to soles, as the asset script printed. -->
  <link rel="preload" as="image" href="/assets/images/loader/dyuno-hang.webp" fetchpriority="high">
  <style>
    .ces-loader {
      --m: 170px;
      --sprite-w: calc(var(--m) * 0.533);
      --sprite-h: calc(var(--m) * 1.0142);
      /* where his hands are once he has settled: body + caption centred on the screen */
      --hands: calc(50% - var(--m) / 2 - 18px);
      --thread-w: max(2px, calc(var(--m) * 0.0177));
      /* the thread ends behind his face (0.26-0.52 of --m below the hands), out of sight even
         when the bounce lifts him 9px up it */
      --thread-len: calc(var(--hands) + var(--m) * 0.38);
      position: fixed;
      inset: 0;
      z-index: 2147483000;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.88);
      /* Nothing for the first 180ms (fast loads never flash it), then a quick fade. The fail-safe
         lifts it even if the controller never runs. */
      animation: ces-loader-in 0.15s ease 0.18s both, ces-loader-failsafe 0.25s ease 12s forwards;
    }
    .ces-loader[hidden] { display: none; }
    @keyframes ces-loader-in { from { opacity: 0; visibility: hidden; } }
    @keyframes ces-loader-failsafe { to { opacity: 0; visibility: hidden; } }

    .ces-loader__swing {
      position: absolute;
      top: 0;
      left: 50%;
      width: 0;
      height: 100%;
      transform-origin: 0 0;
      animation: ces-swing-in 0.7s ease-in-out 1.53s both, ces-swing 2.8s ease-in-out 2.23s infinite;
    }
    @keyframes ces-swing-in { from { transform: rotate(0deg); } to { transform: rotate(5deg); } }
    @keyframes ces-swing { 0%, 100% { transform: rotate(5deg); } 50% { transform: rotate(-5deg); } }

    .ces-loader__thread {
      position: absolute;
      top: 0;
      left: calc(var(--thread-w) / -2);
      width: var(--thread-w);
      height: var(--thread-len);
      border-radius: 0 0 2px 2px;
      background:
        repeating-linear-gradient(-58deg, rgba(122, 68, 0, 0.3) 0 1px, transparent 1px 3px),
        linear-gradient(90deg, #b8760f, #f0b030 42%, #f8c757 60%, #c98714);
      animation: ces-thread-drop 0.26s cubic-bezier(0.3, 0.7, 0.4, 1) 0.18s both;
    }
    @keyframes ces-thread-drop { from { transform: translateY(-100%); } }

    .ces-loader__dyuno {
      position: absolute;
      top: var(--hands);
      left: calc(var(--sprite-w) * -0.4912);
      width: var(--sprite-w);
      height: var(--sprite-h);
      animation: ces-dyuno-drop 1.15s linear 0.38s both;
    }
    /* Slides down from above the screen, stretches the thread 9px, springs back past rest, settles. */
    @keyframes ces-dyuno-drop {
      0% { transform: translateY(calc(-50vh - 100%)); animation-timing-function: cubic-bezier(0.25, 0.6, 0.35, 1); }
      70% { transform: translateY(9px); animation-timing-function: ease-in-out; }
      86% { transform: translateY(-3px); animation-timing-function: ease-in-out; }
      100% { transform: translateY(0); }
    }
    .ces-loader__dyuno img {
      position: absolute;
      display: block;
    }
    .ces-loader__sprite {
      inset: 0;
      width: 100%;
      height: 100%;
    }
    /* Closed eyes, shown for 140ms every second swing, at the far left. */
    .ces-loader__blink {
      left: 19.34%;
      top: 24.42%;
      width: 61.88%;
      height: 29.07%;
      opacity: 0;
      animation: ces-blink 5.6s step-end 2.23s infinite;
    }
    @keyframes ces-blink { 0% { opacity: 0; } 50% { opacity: 1; } 52.5% { opacity: 0; } }

    /* Until his image has arrived he waits above the screen (the thread drops regardless). */
    .ces-loader:not(.is-ready) .ces-loader__swing,
    .ces-loader:not(.is-ready) .ces-loader__dyuno,
    .ces-loader:not(.is-ready) .ces-loader__blink { animation-play-state: paused; }
    .ces-loader:not(.is-ready) .ces-loader__dyuno { visibility: hidden; }

    .ces-loader__text {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(var(--hands) + var(--m) + 26px);
      margin: 0;
      text-align: center;
      font: 600 14px/1.2 'DM Sans', system-ui, sans-serif;
      letter-spacing: 0.02em;
      color: #203154;
    }

    /* If his image can't load: a plain spinner instead of Dyuno and the thread. */
    .ces-loader__spinner {
      display: none;
      position: absolute;
      left: 50%;
      top: calc(var(--hands) + var(--m) - 46px);
      width: 36px;
      height: 36px;
      margin-left: -18px;
      border: 3px solid rgba(32, 49, 84, 0.15);
      border-top-color: #203154;
      border-radius: 50%;
      animation: ces-spin 0.8s linear infinite;
    }
    @keyframes ces-spin { to { transform: rotate(360deg); } }
    .ces-loader.is-fallback .ces-loader__swing { display: none; }
    .ces-loader.is-fallback .ces-loader__spinner { display: block; }

    @media (max-width: 640px) {
      .ces-loader { --m: 130px; }
    }

    @media (prefers-reduced-motion: reduce) {
      /* A still Dyuno, already hanging, and the caption. */
      .ces-loader__swing,
      .ces-loader__thread,
      .ces-loader__dyuno,
      .ces-loader__blink { animation: none; }
      .ces-loader__spinner { display: none !important; }
    }
  </style>
  <noscript><style>.ces-loader { display: none; }</style></noscript>

  <!-- Page loader (styles in <head>, controller below <app-root>). Up from the first paint until
       the page's files have loaded and the app has its first data; the app can hold it up again
       later through PageLoader (core/services/page-loader.service.ts), e.g. while a navigation
       loads. -->
  <div id="ces-loader" class="ces-loader" role="status" aria-live="polite">
    <div class="ces-loader__swing" aria-hidden="true">
      <span class="ces-loader__thread"></span>
      <div class="ces-loader__dyuno">
        <img class="ces-loader__sprite" src="/assets/images/loader/dyuno-hang.webp" alt="" width="181" height="344"
          fetchpriority="high" onload="this.closest('.ces-loader').classList.add('is-ready')"
          onerror="this.closest('.ces-loader').classList.add('is-fallback')">
        <img class="ces-loader__blink" src="/assets/images/loader/dyuno-hang-blink.webp" alt="" width="112" height="100"
          decoding="async" onerror="this.remove()">
      </div>
    </div>
    <span class="ces-loader__spinner" aria-hidden="true"></span>
    <p class="ces-loader__text">Loading…</p>
  </div>

  <app-root></app-root>

  <script>
    // Page loader controller. Every reason to stay up is a key in `holds`; it shows while any is
    // held and fades as soon as the last one goes. The app adds and removes keys with
    // `ces:loading` events (PageLoader). `ces:loader-done` fires when the first one ends - the
    // launcher Dyuno waits for it before walking in.
    (function () {
      var loader = document.getElementById('ces-loader');
      if (!loader) return;
      var app = document.querySelector('app-root');

      var SHOW_DELAY = 180;   // the CSS keeps it invisible this long
      var FADE_MS = 220;
      var FIRST_MAX = 10000;  // a slow image or API never keeps the first screen covered

      // The first session: the page's files (window load) and the app's first data (PageLoader 'app').
      var holds = { page: true, app: true };
      var shownAt = 0;        // performance.now() when this session began (0 = page start)
      var fade = null;        // the running fade-out
      var firstDone = false;
      var firstTimer;

      function anyHeld() { for (var k in holds) return true; return false; }

      function busy(on) {
        if (!app) return;
        if (on) app.setAttribute('aria-busy', 'true'); else app.removeAttribute('aria-busy');
      }

      function show() {
        // Wanted again while fading out: stay up, mid-swing.
        if (fade) { fade.cancel(); fade = null; }
        if (!loader.hidden) return;
        loader.hidden = false;   // back from display:none, every CSS animation starts over
        shownAt = performance.now();
        busy(true);
      }

      function hide() {
        if (loader.hidden || fade) return;
        // Still inside the show delay: it was never visible, so just go.
        if (performance.now() - shownAt < SHOW_DELAY) return finish();
        fade = loader.animate([{ opacity: getComputedStyle(loader).opacity }, { opacity: 0 }],
          { duration: FADE_MS, easing: 'ease-out' });
        fade.onfinish = finish;
      }

      function finish() {
        if (fade) { fade.cancel(); fade = null; }
        loader.hidden = true;    // display:none stops every animation
        busy(false);
        if (!firstDone) {
          firstDone = true;
          clearTimeout(firstTimer);
          window.dispatchEvent(new Event('ces:loader-done'));
        }
      }

      function set(key, on) {
        if (on) holds[key] = true; else delete holds[key];
        if (anyHeld()) show(); else hide();
      }

      busy(true);
      window.addEventListener('ces:loading', function (e) {
        if (e.detail && e.detail.key) set(e.detail.key, !!e.detail.on);
      });
      if (document.readyState === 'complete') set('page', false);
      else window.addEventListener('load', function () { set('page', false); }, { once: true });
      firstTimer = setTimeout(function () {
        delete holds.page;
        delete holds.app;
        if (!anyHeld()) hide();
      }, Math.max(0, FIRST_MAX - performance.now()));
    })();
  </script>
